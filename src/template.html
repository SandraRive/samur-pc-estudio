<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Manual SAMUR-PC Interactivo</title>
<meta name="description" content="Manual de Procedimientos SAMUR-Protección Civil 2026 en formato interactivo de estudio">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Figtree:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: consola de central de comunicaciones — barra superior fija, rejilla de "ámbitos" como teclas de despacho, lector con índice lateral */
:root{
  color-scheme:dark;
  --bg:#080C17; --bg2:#0D1324; --panel:#111A2F; --panel2:#17223C; --line:#22304F; --line2:#2E3E63;
  --fg:#EEF2FF; --fg2:#AEB9D6; --fg3:#7684A8;
  --orange:#FF6B1A; --yellow:#FFD23F; --cyan:#2EC4F1; --red:#FF3B5C; --green:#2EE6A6; --violet:#B98CFF;
  --accent:var(--orange); --ok:#2EE6A6; --bad:#FF4D6A;
  --dose-bg:rgba(255,210,63,.13); --dose-fg:#FFE07A;
  --chip-bg:rgba(46,196,241,.12); --chip-fg:#8FE1FF;
  --shadow:0 18px 50px -20px rgba(0,0,0,.7);
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  color-scheme:light;
  --bg:#F3F5FB; --bg2:#E9EDF7; --panel:#FFFFFF; --panel2:#F1F4FB; --line:#D8DEEE; --line2:#C4CCE2;
  --fg:#0B1430; --fg2:#3A4870; --fg3:#66739A;
  --orange:#E0520A; --yellow:#B98A00; --cyan:#0A86B5; --red:#D61F45; --green:#0D9E6E; --violet:#7A45D6;
  --ok:#0D9E6E; --bad:#D61F45;
  --dose-bg:rgba(224,160,0,.16); --dose-fg:#7A5600;
  --chip-bg:rgba(10,134,181,.1); --chip-fg:#075E80;
  --shadow:0 18px 40px -24px rgba(20,30,70,.35);
}}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#F3F5FB; --bg2:#E9EDF7; --panel:#FFFFFF; --panel2:#F1F4FB; --line:#D8DEEE; --line2:#C4CCE2;
  --fg:#0B1430; --fg2:#3A4870; --fg3:#66739A;
  --orange:#E0520A; --yellow:#B98A00; --cyan:#0A86B5; --red:#D61F45; --green:#0D9E6E; --violet:#7A45D6;
  --ok:#0D9E6E; --bad:#D61F45;
  --dose-bg:rgba(224,160,0,.16); --dose-fg:#7A5600;
  --chip-bg:rgba(10,134,181,.1); --chip-fg:#075E80;
  --shadow:0 18px 40px -24px rgba(20,30,70,.35);
}
/* per-ámbito colour: elements carry --cd (dark) and --cl (light) */
[data-c]{--c:var(--cd)}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) [data-c]{--c:var(--cl)}}
:root[data-theme="light"] [data-c]{--c:var(--cl)}

*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:16px;line-height:1.55;margin:0;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:44px 44px;background-position:-1px -1px;background-attachment:fixed}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(1200px 600px at 80% -10%,color-mix(in srgb,var(--orange) 14%,transparent),transparent 60%),radial-gradient(900px 500px at -10% 30%,color-mix(in srgb,var(--cyan) 10%,transparent),transparent 60%),linear-gradient(var(--bg) 0,color-mix(in srgb,var(--bg) 82%,transparent) 100%);pointer-events:none;z-index:-1}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--yellow);outline-offset:2px;border-radius:6px}
.ic{width:1.15em;height:1.15em;flex:none;display:inline-block;vertical-align:-.18em}
.wrap{max-width:1280px;margin:0 auto;padding-inline:16px}
h1,h2,h3{text-wrap:balance}
.mono{font-family:var(--f-mono)}

/* ===== Top bar ===== */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;height:62px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;flex:none}
.brand .mark{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--orange);color:#160700;position:relative;overflow:hidden}
.brand .mark::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,transparent 0 6px,rgba(255,210,63,.55) 6px 12px);mix-blend-mode:screen;opacity:.5}
.brand .mark .ic{position:relative;z-index:1;width:20px;height:20px}
.brand b{font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.01em;line-height:1}
.brand small{display:block;font-size:11px;color:var(--fg3);letter-spacing:.12em;text-transform:uppercase;margin-top:3px}
.search{flex:1;min-width:0;position:relative;max-width:560px;margin-left:auto}
.search input{width:100%;height:42px;border-radius:12px;border:1px solid var(--line2);background:var(--panel);color:var(--fg);padding:0 14px 0 40px;font:inherit;font-size:15px}
.search input::placeholder{color:var(--fg3)}
.search .ic{position:absolute;left:13px;top:12px;color:var(--fg3)}
.search kbd{position:absolute;right:10px;top:10px;font-family:var(--f-mono);font-size:11px;color:var(--fg3);border:1px solid var(--line2);border-radius:6px;padding:2px 6px}
.xp{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 8px;border-radius:999px;border:1px solid var(--line2);background:var(--panel);text-decoration:none;flex:none}
.xp .lv{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--yellow);color:#1C1400;font-weight:800;font-size:12px;font-family:var(--f-mono)}
.xp span{font-size:13px;font-weight:700;white-space:nowrap}
.iconbtn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line2);background:var(--panel);display:grid;place-items:center;flex:none}
.navrow{border-top:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.navrow::-webkit-scrollbar{display:none}
.navrow .wrap{display:flex;gap:6px;height:46px;align-items:center}
.navrow a{display:flex;align-items:center;gap:7px;padding:7px 12px;border-radius:10px;text-decoration:none;font-size:13.5px;font-weight:600;color:var(--fg2);white-space:nowrap;border:1px solid transparent}
.navrow a .ic{color:var(--c,var(--fg3))}
.navrow a:hover{background:var(--panel)}
.navrow a.on{background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--fg);border-color:color-mix(in srgb,var(--c) 40%,transparent)}
@media (max-width:720px){.xp span,.brand small,.search kbd{display:none}.brand b{font-size:13px}.top .wrap{gap:8px}}
@media (max-width:460px){.brand b{display:none}}

main{padding-block:28px 80px;min-height:70vh}

/* ===== HERO ===== */
.hero{position:relative;border:1px solid var(--line2);border-radius:24px;overflow:hidden;background:linear-gradient(160deg,var(--panel) 0%,var(--bg2) 100%);box-shadow:var(--shadow)}
.hero .chev{height:14px;background:repeating-linear-gradient(-45deg,var(--orange) 0 18px,var(--yellow) 18px 36px)}
.hero .in{display:grid;grid-template-columns:1.25fr .9fr;gap:28px;padding:38px 36px 30px;position:relative}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--orange);display:flex;align-items:center;gap:8px}
.eyebrow .dot{width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 0 0 var(--red);animation:ping 1.6s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--red) 70%,transparent)}100%{box-shadow:0 0 0 12px transparent}}
.hero h1{font-family:var(--f-display);font-weight:900;font-size:clamp(34px,5.6vw,70px);line-height:.98;letter-spacing:-.02em;margin:14px 0 14px}
.hero h1 .o{color:transparent;-webkit-text-stroke:2px var(--fg)}
.hero h1 .hl{color:var(--orange)}
.hero p.lead{font-size:18px;color:var(--fg2);max-width:56ch;margin:0 0 22px}
.hero .ctas{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;gap:9px;height:46px;padding:0 18px;border-radius:12px;border:1px solid var(--line2);background:var(--panel2);font-weight:700;text-decoration:none;font-size:15px}
.btn.pri{background:var(--orange);border-color:var(--orange);color:#160700}
.btn.pri:hover{filter:brightness(1.08)}
.btn:hover{border-color:var(--fg3)}
.btn.sm{height:38px;padding:0 13px;font-size:14px;border-radius:10px}
.monitor{position:relative;border-radius:18px;background:#050812;border:1px solid #1B2744;padding:16px;min-height:230px;display:flex;flex-direction:column;gap:10px;color:#DDE6FF}
.monitor .row{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:12px;color:#7C8BB3;letter-spacing:.08em}
.monitor canvas{width:100%;height:110px;display:block}
.vitals{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.vital{border:1px solid #1B2744;border-radius:12px;padding:8px 10px}
.vital b{display:block;font-family:var(--f-display);font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}
.vital small{font-family:var(--f-mono);font-size:10.5px;color:#7C8BB3;letter-spacing:.1em}
.v1 b{color:#2EE6A6}.v2 b{color:#FFD23F}.v3 b{color:#2EC4F1}
.stats{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line2)}
.stat{padding:16px 22px;border-right:1px solid var(--line2)}
.stat:last-child{border-right:0}
.stat b{font-family:var(--f-display);font-size:28px;display:block;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--fg3)}
@media (max-width:900px){.hero .in{grid-template-columns:1fr;padding:28px 20px}.stats{grid-template-columns:repeat(2,1fr)}.stat:nth-child(2){border-right:0}.stat:nth-child(-n+2){border-bottom:1px solid var(--line2)}}

.sechead{display:flex;align-items:end;justify-content:space-between;gap:16px;margin:44px 0 16px;flex-wrap:wrap}
.sechead h2{font-family:var(--f-display);font-size:clamp(22px,3vw,30px);margin:0;letter-spacing:-.01em}
.sechead p{margin:4px 0 0;color:var(--fg3);font-size:14.5px}

/* ===== Ámbito grid ===== */
.ambs{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.amb{position:relative;display:flex;flex-direction:column;gap:12px;padding:20px;border-radius:20px;background:var(--panel);border:1px solid var(--line);text-decoration:none;overflow:hidden;transition:transform .18s ease,border-color .18s ease}
.amb::before{content:"";position:absolute;inset:0;background:radial-gradient(400px 160px at 100% 0%,color-mix(in srgb,var(--c) 22%,transparent),transparent 70%);pointer-events:none}
.amb:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--c) 60%,transparent)}
.amb .tile{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c);border:1px solid color-mix(in srgb,var(--c) 40%,transparent)}
.amb .tile .ic{width:28px;height:28px}
.amb .num{position:absolute;right:18px;top:16px;font-family:var(--f-mono);font-size:12px;color:var(--fg3)}
.amb h3{font-family:var(--f-display);font-size:18px;margin:0;line-height:1.2}
.amb p{margin:0;color:var(--fg2);font-size:14.5px;flex:1}
.amb .groups{display:flex;flex-wrap:wrap;gap:6px}
.amb .groups span{font-size:12px;padding:3px 8px;border-radius:999px;background:var(--panel2);color:var(--fg2);border:1px solid var(--line)}
.bar{height:6px;border-radius:999px;background:var(--panel2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c,var(--orange));border-radius:inherit;transition:width .5s ease}
.amb .foot{display:flex;justify-content:space-between;font-size:12.5px;color:var(--fg3);font-variant-numeric:tabular-nums}

/* quick refs strip */
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.qcard{display:flex;gap:12px;align-items:center;padding:14px;border-radius:16px;border:1px solid var(--line);background:var(--panel);text-decoration:none;text-align:left}
.qcard:hover{border-color:var(--c)}
.qcard .tile{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c);flex:none}
.qcard b{display:block;font-size:15px}
.qcard small{color:var(--fg3);font-size:12.5px}

/* ===== Ámbito page ===== */
.ahead{position:relative;border-radius:24px;padding:28px;border:1px solid color-mix(in srgb,var(--c) 40%,var(--line));background:linear-gradient(135deg,color-mix(in srgb,var(--c) 18%,var(--panel)) 0%,var(--panel) 70%);overflow:hidden}
.ahead .big{position:absolute;right:-30px;bottom:-40px;color:var(--c);opacity:.12}
.ahead .big .ic{width:220px;height:220px}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13px;color:var(--fg3);margin-bottom:10px}
.crumbs a{text-decoration:none;color:var(--fg2)}
.crumbs a:hover{color:var(--fg)}
.ahead h1{font-family:var(--f-display);font-size:clamp(26px,4vw,44px);margin:0 0 8px;letter-spacing:-.015em;line-height:1.05;display:flex;align-items:center;gap:14px}
.ahead h1 .tile{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;background:var(--c);color:#0A0E1A;flex:none}
.ahead h1 .tile .ic{width:30px;height:30px}
.ahead p{margin:0;color:var(--fg2);max-width:62ch}
.ahead .prog{display:flex;align-items:center;gap:12px;margin-top:18px;max-width:420px;font-size:13px;color:var(--fg2);font-variant-numeric:tabular-nums}
.ahead .prog .bar{flex:1;height:8px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:16px 0 6px;scrollbar-width:thin}
.tab{text-decoration:none;display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-weight:600;font-size:14px;white-space:nowrap;color:var(--fg2)}
.tab .n{font-family:var(--f-mono);font-size:11.5px;padding:1px 7px;border-radius:999px;background:var(--panel2);color:var(--fg3)}
.tab.on{background:var(--c);color:#0A0E1A;border-color:var(--c)}
.tab.on .n{background:rgba(0,0,0,.18);color:#0A0E1A}
.tab.on .ic{color:#0A0E1A}
.tab .ic{color:var(--c)}
.gsec{margin-top:26px}
.gsec h2{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-size:19px;margin:0 0 12px}
.gsec h2 .ic{color:var(--c)}
.gsec h2 small{font-family:var(--f-body);font-size:13px;color:var(--fg3);font-weight:500}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.pcard{display:flex;gap:12px;align-items:flex-start;padding:14px 14px;border-radius:14px;background:var(--panel);border:1px solid var(--line);text-decoration:none;transition:border-color .15s,transform .15s}
.pcard:hover{border-color:color-mix(in srgb,var(--c) 70%,transparent);transform:translateX(2px)}
.pcard .tile{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c);flex:none}
.pcard .t{min-width:0;flex:1}
.pcard b{display:block;font-size:15px;line-height:1.3}
.pcard small{display:flex;gap:10px;color:var(--fg3);font-size:12.5px;margin-top:4px;font-variant-numeric:tabular-nums}
.pcard .done{color:var(--ok);flex:none;opacity:0}
.pcard.isdone .done{opacity:1}
.pcard.isdone{border-color:color-mix(in srgb,var(--ok) 35%,var(--line))}

/* ===== Reader ===== */
.reader{display:grid;grid-template-columns:260px minmax(0,1fr);gap:28px;align-items:start}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 124px);max-height:calc(100vh - 140px);overflow:auto;padding-right:4px;scrollbar-width:thin}
.side h4{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg3);margin:0 0 8px}
.side .toc a{display:block;padding:6px 10px;border-left:2px solid var(--line);font-size:13.5px;color:var(--fg2);text-decoration:none;line-height:1.35}
.side .toc a:hover{color:var(--fg);border-color:var(--c)}
.side .sib{margin-top:22px}
.side .sib a{display:flex;gap:8px;padding:6px 8px;border-radius:8px;font-size:13px;color:var(--fg2);text-decoration:none;line-height:1.3}
.side .sib a.on{background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--fg);font-weight:600}
.side .sib a:hover{background:var(--panel)}
.side .sib .ic{color:var(--ok);width:14px;height:14px;margin-top:2px}
.side .sib .ph{width:14px;flex:none}
@media (max-width:980px){.reader{grid-template-columns:1fr}.side{position:static;max-height:none;display:none}}
.phead{border-radius:22px;padding:24px 26px;border:1px solid color-mix(in srgb,var(--c) 40%,var(--line));background:linear-gradient(135deg,color-mix(in srgb,var(--c) 16%,var(--panel)),var(--panel) 60%);position:relative;overflow:hidden}
.phead h1{font-family:var(--f-display);font-size:clamp(24px,3.4vw,38px);line-height:1.08;margin:0 0 14px;letter-spacing:-.015em}
.meta{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:5px 10px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);color:var(--fg2);font-variant-numeric:tabular-nums}
.pill .ic{color:var(--c);width:14px;height:14px}
.pactions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.btn.done{background:color-mix(in srgb,var(--ok) 18%,transparent);border-color:var(--ok);color:var(--ok)}
.doc{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:26px 30px;margin-top:14px;font-size:16.5px;line-height:1.65}
@media (max-width:600px){.doc{padding:20px 16px;font-size:16px}.phead{padding:20px 18px}}
.doc>*{max-width:78ch}
.doc p{margin:0 0 12px}
.doc h3{font-family:var(--f-display);font-size:17px;letter-spacing:.01em;margin:30px 0 12px;padding:10px 14px;border-radius:12px;background:color-mix(in srgb,var(--c) 12%,transparent);border-left:4px solid var(--c);text-transform:none;line-height:1.3;scroll-margin-top:130px}
.doc h3:first-child{margin-top:0}
.doc .lab{display:flex;align-items:center;gap:9px;font-weight:800;margin:20px 0 8px;font-size:16px}
.doc .lab .ic{color:var(--c);width:18px;height:18px}
.doc ul{margin:4px 0 14px;padding-left:22px}
.doc ul ul{margin:6px 0 6px;padding-left:20px}
.doc li{margin:5px 0;padding-left:4px}
.doc li::marker{color:var(--c)}
.doc ul ul li::marker{color:var(--fg3)}
.doc li.num{list-style:none;position:relative}
.doc li.num::before{content:attr(data-n);position:absolute;left:-26px;top:.1em;min-width:20px;height:20px;border-radius:6px;background:color-mix(in srgb,var(--c) 22%,transparent);color:var(--c);font-family:var(--f-mono);font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 3px}
.prebox{margin:14px 0 18px;border:1px dashed var(--line2);border-radius:14px;background:var(--bg2);max-width:100%!important}
.prebox .cap{display:flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg3);padding:8px 12px;border-bottom:1px dashed var(--line2)}
.prebox pre{margin:0;padding:12px;overflow-x:auto;font-family:var(--f-mono);font-size:12.5px;line-height:1.5;color:var(--fg2)}
.callout{display:flex;gap:12px;padding:14px 16px;border-radius:14px;margin:14px 0;background:color-mix(in srgb,var(--yellow) 12%,transparent);border:1px solid color-mix(in srgb,var(--yellow) 40%,transparent)}
.callout .ic{color:var(--yellow);width:20px;height:20px;margin-top:2px}
.callout p{margin:0}
.dose{background:var(--dose-bg);color:var(--dose-fg);font-weight:700;padding:0 4px;border-radius:5px;white-space:nowrap;font-variant-numeric:tabular-nums}

<script id="data" type="application/json">/*DATA*/</script>
<script id="ref" type="application/json">/*REF*/</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent);
const R=JSON.parse(document.getElementById('ref').textContent);
const ICONS=/*ICONS*/;
const ic=(n,c='')=>`<svg class="ic ${c}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]||ICONS['file-text']||''}</svg>`;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- colours per ámbito ---------- */
const COL={admin:['#8FA2FF','#3F51C9'],central:['#2EC4F1','#0A7FAD'],operativos:['#FF7A2E','#D24A05'],psico:['#C38CFF','#7A3FD1'],sva:['#FF4D6A','#C81E40'],svb:['#FFB020','#A86A00'],tecnicas:['#2EE6C0','#0B8F78'],anexos:['#FF7AC6','#C0287F'],repaso:['#FFD23F','#9A7400']};
const cv=k=>`data-c style="--cd:${COL[k][0]};--cl:${COL[k][1]}"`;

/* ---------- state ---------- */
let S={done:{},xp:0,best:{},seen:{}};
try{const s=JSON.parse(localStorage.getItem('samurpc-v1')||'null');if(s)S=Object.assign(S,s)}catch(e){}
const save=()=>{try{localStorage.setItem('samurpc-v1',JSON.stringify(S))}catch(e){}};
const RANKS=[[0,'Aspirante','Acabas de entrar en la base'],[60,'Voluntario/a PC','Primeras guardias'],[180,'TATS','Ya conoces las claves'],[400,'Enfermero/a','Dominas técnicas y fármacos'],[750,'Médico/a SVA','Protocolos bajo control'],[1200,'Charly','Jefe/a de División de Guardia'],[1800,'Supervisor/a','Visión de todo el operativo'],[2600,'Directivo/a de Guardia','Máximo responsable de la guardia']];
function rank(){let i=0;RANKS.forEach((r,k)=>{if(S.xp>=r[0])i=k});const cur=RANKS[i],nx=RANKS[i+1];return{i,cur,nx,pct:nx?Math.min(100,(S.xp-cur[0])/(nx[0]-cur[0])*100):100}}
function addXP(n){S.xp=Math.max(0,S.xp+n);save();drawXP()}
function drawXP(){const r=rank();$('#xp').innerHTML=`<span class="lv">${r.i+1}</span><span>${esc(r.cur[1])} · ${S.xp} XP</span>`}

/* ---------- index ---------- */
const P=D.procs; const PI={}; P.forEach((p,i)=>{p.i=i;PI[p.id]=p});
const AMB={}; D.tree.forEach(a=>AMB[a.id]=a);
D.tree.forEach(a=>{a.procs=P.filter(p=>p.amb===a.id);a.groups.forEach(g=>g.procs=a.procs.filter(p=>p.grp===g.name))});
const ACC={'á':'a','à':'a','ä':'a','â':'a','é':'e','è':'e','ë':'e','ê':'e','í':'i','ì':'i','ï':'i','î':'i','ó':'o','ò':'o','ö':'o','ô':'o','ú':'u','ù':'u','ü':'u','û':'u','ñ':'n','ç':'c'};
const nz=s=>s.toLowerCase().replace(/[áàäâéèëêíìïîóòöôúùüûñç]/g,c=>ACC[c]);
P.forEach(p=>{p.txt=p.b.map(b=>b.x).join(' \u2022 ');p.nt=nz(p.txt);p.ntitle=nz(p.title)});
const fieldText=d=>d.f.map(f=>f.b.map(b=>b.x).join(' ')).join(' ');
D.drugs.forEach((d,i)=>{d.i=i;d.fun=(d.f.find(f=>/Funci|Acci/.test(f.f))||d.f[0]||{b:[]}).b.map(b=>b.x).join(' ');d.nt=nz(d.n+' '+fieldText(d))});

/* abbreviation regex */
const STOPAB=new Set(['DE','EN','DM','AP','FC','O2']);
const ABM={};D.abbr.forEach(([k,v])=>{if(k.length>=2&&/[A-Z].*[A-Z]/.test(k)&&!STOPAB.has(k)&&/^[A-Za-z0-9]+$/.test(k))ABM[k]=v});
const ABRE=new RegExp('\\b('+Object.keys(ABM).sort((a,b)=>b.length-a.length).join('|')+')\\b','g');

/* ---------- text enrichment ---------- */
const DOSE=/(\b\d+(?:[.,]\d+)?(?:\s?[-–]\s?\d+(?:[.,]\d+)?)?\s?(?:mg|mcg|µg|g|ml|mL|UI|mEq|mmHg|mmol|J|julios|lpm|rpm|kg|cm|mm)(?:\s?\/\s?(?:kg|h|min|m2|dl|ml|L))*(?:\/(?:h|min))?)(?![\w])/g;
function enrich(t,q){
  let h=esc(t);
  h=h.replace(DOSE,'<span class="dose">$1</span>');
  h=h.replace(/\b((?:[Cc]ódigos?|[Cc]laves?|CÓDIGO|CLAVE)\s+(?:\d+(?:\.\d+)*|VISEM|VISNNA|PIC|Crisis|Infarto|Víctor|VICTOR))/g,'<span class="code">$1</span>');
  h=h.replace(/\b(P([0-4]))\b(?=\s?[-–:]|\s)/g,'<span class="prio p$2">$1</span>');
  h=h.replace(/(<[^>]+>)|([^<]+)/g,(m,tag,txt)=>tag?tag:txt.replace(ABRE,'<abbr class="ab" data-a="$1">$1</abbr>'));
  if(q){const re=new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');h=h.replace(/(<[^>]+>)|([^<]+)/g,(m,tag,txt)=>tag?tag:txt.replace(re,'<mark>$1</mark>'))}
  return h;
}
const LABIC=[[/indicaci/i,'circle-check'],[/contraindic/i,'ban'],[/material|equipo/i,'package'],[/t[eé]cnica|procedimiento|actuaci|pasos|manejo|tratamiento/i,'list-checks'],[/consideraci|observaci|nota/i,'info'],[/precauci|riesgo|complicaci/i,'shield-alert'],[/dosis|f[aá]rmac|medicaci|perfusi/i,'pill'],[/valoraci|evaluaci|diagn[oó]stic/i,'eye'],[/traslado|transporte/i,'ambulance'],[/funciones|responsab/i,'users'],[/criterio/i,'target'],[/objet|definici/i,'crosshair']];
const labIcon=t=>{for(const [r,n] of LABIC) if(r.test(t)) return n; return 'chevron-right'};
const CALL=/^(NOTA|Nota|ATENCI[ÓO]N|Atenci[óo]n|Recuerde|RECUERDE|Importante|IMPORTANTE|Precauci[óo]n|PRECAUCI[ÓO]N|No (?:se )?(?:debe|olvide|retrase|demore)|NUNCA|Nunca)\b/;

function renderBlocks(bs,q,tocOut){
  let h='',depth=0,open=[];let hi=0;
  const closeTo=d=>{while(depth>d){if(open[depth])h+='</li>';h+='</ul>';open[depth]=false;depth--}};
  for(const b of bs){if(!b.x||!b.x.trim())continue;
    if(b.t==='li'){
      const tgt=b.l+1;
      if(depth<tgt){while(depth<tgt){depth++;h+='<ul>';open[depth]=false}}
      else{closeTo(tgt);if(open[depth])h+='</li>'}
      h+=b.o?`<li class="num" data-n="${esc(b.o)}">`:'<li>';h+=enrich(b.x,q);open[depth]=true;continue;
    }
    closeTo(0);
    if(b.t==='h'){const id='s'+(hi++);tocOut&&tocOut.push([id,b.x]);h+=`<h3 id="${id}">${enrich(cap(b.x),q)}</h3>`}
    else if(b.t==='lab'){h+=`<div class="lab">${ic(labIcon(b.x))}<span>${enrich(b.x,q)}</span></div>`}
    else if(b.t==='pre'){h+=`<div class="prebox"><div class="cap">${ic('layers')}Tabla / esquema · formato original</div><pre>${esc(b.x)}</pre></div>`}
    else if(CALL.test(b.x)){h+=`<div class="callout">${ic('triangle-alert')}<p>${enrich(b.x,q)}</p></div>`}
    else h+=`<p>${enrich(b.x,q)}</p>`;
  }
  closeTo(0);return h;
}
function cap(s){ // sentence-case shouty headings for readability
  const letters=s.replace(/[^A-Za-zÁÉÍÓÚÑÜáéíóúñü]/g,'');
  if(letters&&letters===letters.toUpperCase()){const keep=/^(SVA|SVB|USVA|USVB|PCR|RCP|IMV|NRBQ|PIC|CECOR|DRP|SCA|SCACEST|SCASEST|TEP|TCE|EPI|EPIS|OVACE|DESA|DEA|ECG|PMU|PSA|JDS|UPSI|UPSQ|STARS|RN|NNA|VIH|VHB|VHC|SAMUR|ERA|ABCDE|TETRA|PMR|SMS|CHARLY|DELTA|LIMA|FENIX|ROMEO|URO|II|III|IV|I|DDS|INR|EZ-IO|COHB|ETCO2|SATO2|VMNI|RUSH|CAUSE|E-FAST|FAST|AESP|FV|TV|AIT|EAP|IC|EPOC|ADIF|RENFE|SEAM|UAPF|DEC|VISEM|VISNNA|GCS|SIR|ERC)$/;
    return s.toLowerCase().replace(/[a-záéíóúñü0-9\-]+/gi,(w,i)=>{const U=w.toUpperCase();return keep.test(U)?U:w}).replace(/^\s*([a-záéíóúñ])/,(m,c)=>m.replace(c,c.toUpperCase())).replace(/([.:]\s+)([a-záéíóúñ])/g,(m,a,c)=>a+c.toUpperCase())}
  return s;
}

let ecgRAF=null;
function startECG(){
  const cv_=$('#ecg');if(!cv_)return;const ctx=cv_.getContext('2d');
  const dpr=window.devicePixelRatio||1;const W=cv_.clientWidth,H=cv_.clientHeight;cv_.width=W*dpr;cv_.height=H*dpr;ctx.scale(dpr,dpr);
  const beat=t=>{t=t%1;const g=(c,w,a)=>a*Math.exp(-((t-c)**2)/(2*w*w));return g(.18,.025,.12)-g(.36,.008,.15)+g(.39,.012,1)-g(.42,.01,.28)+g(.62,.045,.25)};
  let x=0,last=null;const speed=W/3.2;const red=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const pts=new Float32Array(Math.ceil(W)+2).fill(NaN);
  const y=v=>H*.62-v*H*.5;
  if(red){ctx.strokeStyle='#2EE6A6';ctx.lineWidth=2;ctx.beginPath();for(let i=0;i<W;i++){const v=beat(i/(W/3));i?ctx.lineTo(i,y(v)):ctx.moveTo(i,y(v))}ctx.stroke();return}
  cancelAnimationFrame(ecgRAF);let t0=performance.now();
  const loop=now=>{if(!document.body.contains(cv_))return;const dt=(now-(last||now))/1000;last=now;const prev=x;x+=dt*speed;
    for(let i=Math.floor(prev);i<=Math.floor(x);i++){const xi=i%Math.ceil(W);pts[xi]=beat(i/(W/3.2)*1.15)}
    if(x>W)x-=W;
    ctx.clearRect(0,0,W,H);ctx.strokeStyle='rgba(46,230,166,.12)';ctx.lineWidth=1;for(let gx=0;gx<W;gx+=20){ctx.beginPath();ctx.moveTo(gx,0);ctx.lineTo(gx,H);ctx.stroke()}
    ctx.lineWidth=2.2;ctx.strokeStyle='#2EE6A6';ctx.shadowColor='#2EE6A6';ctx.shadowBlur=8;ctx.beginPath();let pen=false;
    for(let i=0;i<W;i++){if(Math.abs(i-x)<14){pen=false;continue}const v=pts[i];if(isNaN(v)){pen=false;continue}pen?ctx.lineTo(i,y(v)):(ctx.moveTo(i,y(v)),pen=true)}
    ctx.stroke();ctx.shadowBlur=0;ctx.fillStyle='#E8FFF6';ctx.beginPath();ctx.arc(x,y(pts[Math.floor(x)]||0),2.6,0,7);ctx.fill();
    const hr=$('#hr');if(hr&&Math.random()<.01)hr.textContent=70+Math.floor(Math.random()*6);
    const ck=$('#clk');if(ck){const d=new Date();ck.textContent=d.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}
    ecgRAF=requestAnimationFrame(loop)};
  ecgRAF=requestAnimationFrame(loop);
}

    <div><h2>${esc(r.cur[1])}</h2><p>${esc(r.cur[2])}${r.nx?` · siguiente rango: <b>${esc(r.nx[1])}</b> a ${r.nx[0]} XP`:' · rango máximo'}</p><div class="bar"><i style="width:${r.pct}%"></i></div></div>

  <div class="sechead"><div><h2>Chuletas</h2><p>Resumen visual de lo que más cae. Cada una enlaza al procedimiento completo.</p></div></div>
  <div class="cheats">
    <div class="cheat" id="repaso-prioridades" ${cv('sva')}><h3>${ic('siren')}Prioridades de la Central</h3>
      <div class="prios">
        <div><b style="background:#FF3B5C">P1</b><span><strong>Emergencia</strong>Urgencia vital. Unidad activada en emergencia.</span></div>
        <div><b style="background:#FF9F1A">P2</b><span><strong>Urgencia</strong>Urgencia no vital. Unidad activada en emergencia.</span></div>
        <div><b style="background:#FFD23F">P3</b><span><strong>Preferente</strong>No vital, con condicionante social. Sin activación en emergencia.</span></div>
        <div><b style="background:#2EE6A6">P4</b><span><strong>Normal</strong>No urgencia. Sin activación en emergencia.</span></div>
      </div><a class="more" href="${procLink('Gestión de recursos')}">Gestión de recursos ${ic('arrow-right')}</a></div>
    <div class="cheat" ${cv('central')}><h3>${ic('activity')}Situaciones operativas USVA</h3>
      <div class="lights">
        <div><i style="color:#2EE6A6;background:#2EE6A6"></i><span><b>1 · Verde</b> — Normalidad. Asignación de recursos habitual.</span></div>
        <div><i style="color:#FFD23F;background:#FFD23F"></i><span><b>2 · Amarillo</b> — Alerta de saturación: ≤ 6 USVA mañana, ≤ 5 tarde, ≤ 2 noche. Control estricto de tiempos.</span></div>
        <div><i style="color:#FF3B5C;background:#FF3B5C"></i><span><b>3 · Rojo</b> — Saturación: solo 2 USVA en M/T y 1 de noche. Se reservan USVA para códigos graves.</span></div>
      </div><a class="more" href="${procLink('Gestión de recursos')}">Ver tiempos de control ${ic('arrow-right')}</a></div>
    <div class="cheat" id="repaso-imv" ${cv('svb')}><h3>${ic('triangle-alert')}IMV · petos de colores</h3>
      <div class="vests">
        ${[['#FF3B5C','Jefe de Dispositivo Sanitario'],['#2EE6A6','Jefe PSA'],['#9B5CFF','Rescate sanitario / 1er triaje'],['#9B5CFF','Triaje (2º)'],['#9B5CFF','Numerador'],['#FF8A1A','Espera de recursos'],['#2EE6A6','Filiación'],['#2EE6A6','Evacuación'],['#2E8BFF','Logística y comunicaciones'],['#2EE6A6','Pacientes leves («verde»)']].map(([c,t])=>`<div><i style="background:${c}"></i>${t}</div>`).join('')}
      </div><a class="more" href="${procLink('Incidentes con múltiples')}">Procedimiento IMV ${ic('arrow-right')}</a></div>
    <div class="cheat" ${cv('svb')}><h3>${ic('list-ordered')}Triaje STARS</h3>
      <div class="steps">
        <div><b class="n">1</b><span><b>Rescate</b> · En el foco, por uno de los primeros TATS. Separa moderados/graves recuperables de ilesos y fallecidos.</span></div>

      <div class="codes" style="display:grid;gap:8px">${R.esp.map(([c,t])=>`<div style="font-size:13.5px;line-height:1.35"><span class="code">${esc(c)}</span> ${esc(t)}</div>`).join('')}</div></div>
    <div class="cheat" id="repaso-indicativos" ${cv('admin')}><h3>${ic('users')}Indicativos</h3>

  document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>location.hash='quiz-'+b.dataset.m);

/* ---------- quiz ---------- */
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const clip=(s,n)=>s.length>n?s.slice(0,n).replace(/\s\S*$/,'')+'…':s;
function poolOf(m){
  if(m==='claves'){const c=R.claves.filter(x=>!/^Estatus/.test(x[0]));return c.map(([k,v])=>Math.random()<.65?{k:'Claves de radio',q:`¿Qué significa la clave ${k}?`,a:v,d:shuf(c.filter(x=>x[0]!==k)).slice(0,3).map(x=>x[1])}:{k:'Claves de radio',q:`«${clip(v,110)}» ¿Qué clave es?`,a:'Clave '+k,d:shuf(c.filter(x=>x[0]!==k)).slice(0,3).map(x=>'Clave '+x[0])})}
  if(m==='codigos'){const all=R.codigos.flatMap(g=>g.c.map(c=>[...c,g]));return all.map(([c,t,g])=>{const same=shuf(all.filter(x=>x[0]!==c&&x[2]===g));const oth=shuf(all.filter(x=>x[0]!==c));const ds=[...same,...oth].slice(0,3);return Math.random()<.5?{k:'Código de incidente',q:`¿Qué es el código de incidente ${c}?`,a:t,d:ds.map(x=>x[1])}:{k:'Código de incidente',q:`«${t}» corresponde al código…`,a:c,d:ds.map(x=>x[0])}})}
  if(m==='indicativos'){const all=[...R.ind['Particulares'],...R.ind['Generales'],...R.ind['Según base o función'],...R.ind['Ajenos']];return all.map(([k,v])=>({k:'Indicativos',q:`¿Quién o qué es «${k}»?`,a:v,d:shuf(all.filter(x=>x[0]!==k&&x[1]!==v)).slice(0,3).map(x=>x[1])}))}
  if(m==='farmacos'){const ds=D.drugs.filter(d=>d.fun.length>25);return ds.map(d=>{let f=d.fun;d.n.split(/[\s\/]+/).forEach(w=>{if(w.length>4)f=f.replace(new RegExp(w,'gi'),'•••')});return{k:'Vademécum',q:`¿Qué fármaco es? «${clip(f,190)}»`,a:d.n,d:shuf([...new Set(ds.filter(x=>x.n!==d.n).map(x=>x.n))]).slice(0,3)}})}
  if(m==='abrev'){const all=D.abbr.filter(x=>x[0].length>1);return all.map(([k,v])=>({k:'Abreviaturas',q:`¿Qué significa «${k}»?`,a:v,d:shuf(all.filter(x=>x[0]!==k&&x[1]!==v)).slice(0,3).map(x=>x[1])}))}
  if(m==='mix')return['claves','codigos','indicativos','farmacos','abrev'].flatMap(poolOf);
  return [];
}
let Q=null,QT=null;
function vQuiz(m){
  const meta=MODES.find(x=>x[0]===m);if(!meta)return vRepaso();
  const n=m==='mix'?15:10;
  Q={m,meta,items:shuf(poolOf(m)).slice(0,n).map(it=>({...it,opts:shuf([it.a,...it.d])})),i:0,score:0,streak:0,maxStreak:0,ok:0,wrong:[]};
  qDraw();
}
const TLIM=20;
function qDraw(){
  clearInterval(QT);
  const {meta,items,i}=Q;
  if(i>=items.length)return qEnd();
  const it=items[i];
  app.innerHTML=`<div class="quiz fadein" ${cv(meta[4])}>
    <div class="qtop"><a class="btn sm" href="#repaso">${ic('arrow-left')}Salir</a>
      <div class="meta"><span class="pill">${ic('list-ordered')}<b>${i+1}</b>/${items.length}</span><span class="pill">${ic('star')}<b>${Q.score}</b> pts</span><span class="pill">${ic('flame')}racha <b>${Q.streak}</b></span></div></div>
    <div class="timer"><i id="tb" style="width:100%"></i></div>
    <div class="qbox"><div class="qk">${ic(meta[3])} ${esc(it.k)}</div><h2>${esc(it.q)}</h2>
      <div class="opts">${it.opts.map((o,k)=>`<button class="opt" data-k="${k}"><span class="k">${'ABCD'[k]}</span><span>${esc(o)}</span></button>`).join('')}</div>
      <div class="fb" id="fb"></div></div></div>`;
  const t0=performance.now();let answered=false;
  const answer=k=>{if(answered)return;answered=true;clearInterval(QT);
    const el=(performance.now()-t0)/1000;const okk=it.opts.indexOf(it.a);
    document.querySelectorAll('.opt').forEach((b,j)=>{b.disabled=true;if(j===okk)b.classList.add('ok');if(j===k&&k!==okk)b.classList.add('ko')});
    let msg;
    if(k===okk){Q.streak++;Q.maxStreak=Math.max(Q.maxStreak,Q.streak);Q.ok++;const pts=Math.round(100+Math.max(0,TLIM-el)*5)*(Q.streak>=3?2:1);Q.score+=pts;popup('+'+pts+(Q.streak>=3?' 🔥':''));msg=`<span class="msg ok">${ic('circle-check')}¡Correcto! +${pts}</span>`}
    else{Q.streak=0;Q.wrong.push(it);msg=`<span class="msg ko">${ic('circle-x')}${k<0?'Se acabó el tiempo':'Incorrecto'}</span>`}
    $('#fb').innerHTML=msg+`<button class="btn sm pri" id="nx">${Q.i+1<Q.items.length?'Siguiente':'Ver resultado'}${ic('arrow-right')}</button>`;
    $('#nx').onclick=()=>{Q.i++;qDraw()};$('#nx').focus();
  };
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.k));
  QT=setInterval(()=>{const el=(performance.now()-t0)/1000;const tb=$('#tb');if(!tb){clearInterval(QT);return}tb.style.width=Math.max(0,100-el/TLIM*100)+'%';tb.style.backgroundPosition=(el/TLIM*100)+'% 0';if(el>=TLIM)answer(-1)},100);
}
function qEnd(){
  const {m,meta,score,ok,items,wrong,maxStreak}=Q;const xp=ok*3+(ok===items.length?10:0);
  const rec=score>(S.best[m]||0);if(rec)S.best[m]=score;addXP(xp);save();
  app.innerHTML=`<div class="quiz fadein" ${cv(meta[4])}><div class="qbox result">
    <div class="qk">${ic('trophy')} ${esc(meta[1])}</div>
    <div class="score">${score}</div><p>${ok}/${items.length} aciertos · mejor racha ${maxStreak} · <b>+${xp} XP</b>${rec?' · <b style="color:var(--yellow)">¡Nuevo récord!</b>':''}</p>
    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><button class="btn pri" id="again">${ic('rotate-ccw')}Otra ronda</button><a class="btn" href="#repaso">${ic('gamepad-2')}Zona de repaso</a></div>
    ${wrong.length?`<div class="rv"><h3 style="font-family:var(--f-display);font-size:16px;margin:8px 0 2px">Para repasar</h3>${wrong.map(w=>`<div>${esc(w.q)}<br>→ <b>${esc(w.a)}</b></div>`).join('')}</div>`:''}
  </div></div>`;
  $('#again').onclick=()=>vQuiz(m);
  if(ok===items.length)popup('¡Pleno!');
}
function popup(t){const d=document.createElement('div');d.className='pop';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),850)}

/* ---------- search ---------- */
function vSearch(q){
  const n=nz(q.trim());if(n.length<2){route();return}
  const hits=[];
  for(const p of P){let s=0;if(p.ntitle.includes(n))s+=1000;let c=0,i=p.nt.indexOf(n);const first=i;while(i>=0&&c<50){c++;i=p.nt.indexOf(n,i+n.length)}s+=c;if(s)hits.push([s,p,first])}
  hits.sort((a,b)=>b[0]-a[0]);
  const drugs=D.drugs.filter(d=>d.nt.includes(n)).slice(0,8);
  const ab=D.abbr.filter(([k,v])=>nz(k)===n||nz(v).includes(n)).slice(0,6);
  const cl=R.claves.filter(([k,v])=>nz('clave '+k)===n||nz(v).includes(n)).slice(0,6);
  const snip=(p,i)=>{if(i<0)return'';const a=Math.max(0,i-80);return(a?'…':'')+esc(p.txt.slice(a,i+n.length+120)).replace(new RegExp('('+q.trim().replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<mark>$1</mark>')+'…'};
  app.innerHTML=`<div class="fadein"><div class="sechead" style="margin-top:0"><div><h2>Resultados para «${esc(q)}»</h2><p>${hits.length} procedimientos · ${drugs.length} fármacos · ${ab.length+cl.length} siglas y claves</p></div></div>
   ${cl.length||ab.length?`<div class="abbrs" style="margin-bottom:16px" ${cv('central')}>${cl.map(([k,v])=>`<div><b>Clave ${esc(k)}</b><span>${esc(v)}</span></div>`).join('')}${ab.map(([k,v])=>`<div><b>${esc(k)}</b><span>${esc(v)}</span></div>`).join('')}</div>`:''}
   ${drugs.length?`<div class="drugs" style="margin-bottom:16px" ${cv('anexos')}>${drugs.map(d=>`<button class="drug" data-i="${d.i}"><b>${ic('pill')}${esc(d.n)}</b><small>${esc(d.fun)}</small></button>`).join('')}</div>`:''}
   <div class="res">${hits.slice(0,60).map(([s,p,i])=>{const a=AMB[p.amb],g=a.groups.find(x=>x.name===p.grp);return `<a class="ritem" href="#p-${p.id}" data-q="1" ${cv(p.amb)}><span class="tile">${ic(g.icon)}</span><span style="min-width:0"><b>${esc(p.title)}</b><small>${esc(a.name)} · ${esc(g.name)}</small><p>${snip(p,i)}</p></span></a>`}).join('')||'<div class="empty">Nada por aquí. Prueba con otra palabra, una sigla o un número de clave.</div>'}</div></div>`;
  document.querySelectorAll('.drug').forEach(b=>b.onclick=()=>openDrug(+b.dataset.i));
  document.querySelectorAll('.ritem').forEach(a=>a.onclick=()=>{lastQ=q.trim()});
}

/* ---------- router ---------- */
function route(){
  clearInterval(QT);const h=decodeURIComponent(location.hash.slice(1));
  let navk='inicio';
  if(!h.startsWith('p-'))lastQ='';
  if(!h||h==='inicio')vHome();
  else if(h.startsWith('a-')){const [id,g]=h.slice(2).split('.');navk='a-'+id;vAmb(id,g)}
  else if(h.startsWith('p-')){const p=PI[h.slice(2)];navk=p?'a-'+p.amb:'inicio';vProc(h.slice(2))}
  else if(h==='vademecum'){navk='vademecum';vVadem()}
  else if(h==='abreviaturas'){navk='vademecum';vAbbr()}
  else if(h.startsWith('repaso')){navk='repaso';vRepaso(h.includes('-')?h:null)}
  else if(h.startsWith('quiz-')){navk='repaso';vQuiz(h.slice(5))}
  else vHome();
  drawNav(navk);
  if(!h.startsWith('repaso-'))scrollTo(0,0);
  const on=document.querySelector('.navrow a.on');on&&on.scrollIntoView({block:'nearest',inline:'nearest'});
}
addEventListener('hashchange',()=>{$('#q').value='';route()});
let st;$('#q').addEventListener('input',e=>{clearTimeout(st);const v=e.target.value;st=setTimeout(()=>{if(v.trim().length>=2)vSearch(v);else route()},160)});
addEventListener('keydown',e=>{if(e.key==='/'&&document.activeElement.tagName!=='INPUT'){e.preventDefault();$('#q').focus()}
  if(Q&&location.hash.startsWith('#quiz-')&&/^[1-4a-dA-D]$/.test(e.key)){const k='1234'.indexOf(e.key)>=0?'1234'.indexOf(e.key):'abcd'.indexOf(e.key.toLowerCase());const b=document.querySelectorAll('.opt')[k];b&&!b.disabled&&b.click()}});
/* abbreviation tooltip */
const tip=document.createElement('div');tip.className='tip';tip.hidden=true;document.body.appendChild(tip);
const showTip=(el)=>{const k=el.dataset.a;tip.innerHTML=`<b>${esc(k)}</b> · ${esc(ABM[k]||'')}`;tip.hidden=false;const r=el.getBoundingClientRect();const w=Math.min(280,innerWidth-24);tip.style.left=Math.max(12,Math.min(innerWidth-w-12,r.left))+'px';tip.style.top=(r.bottom+8)+'px'};
document.addEventListener('mouseover',e=>{const a=e.target.closest&&e.target.closest('abbr.ab');if(a)showTip(a)});
document.addEventListener('mouseout',e=>{if(e.target.closest&&e.target.closest('abbr.ab'))tip.hidden=true});
document.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('abbr.ab');if(a)showTip(a);else tip.hidden=true});
addEventListener('scroll',()=>{tip.hidden=true},{passive:true});
/* theme */
const themeBtn=$('#theme');
function curDark(){const t=document.documentElement.dataset.theme;return t?t==='dark':!matchMedia('(prefers-color-scheme: light)').matches}
function drawTheme(){themeBtn.innerHTML=ic(curDark()?'sun':'moon')}
themeBtn.onclick=()=>{document.documentElement.dataset.theme=curDark()?'light':'dark';drawTheme()};
$('#markIc').innerHTML=ic('ambulance');$('#sIc').innerHTML=ic('search');
$('#foot').textContent=`${P.length} procedimientos · ${D.drugs.length} fármacos · ${D.abbr.length} abreviaturas`;
drawTheme();drawXP();route();
</script>
