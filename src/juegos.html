<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Entreno SAMUR-PC</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Tests, juegos y actividades para memorizar el Manual de Procedimientos SAMUR-Protección Civil 2026.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23FF6B1A'/%3E%3Cpath d='M16 7v18M7 16h18' stroke='%23160700' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: consola de entrenamiento — cabecera fija con nivel y racha, reto del día como protagonista y tres bandejas de juegos (Tests · Juegos rápidos · Memorizar). */
:root{
  --bg:#F3F5FA; --bg2:#E7EBF3; --panel:#FFFFFF; --panel2:#F1F4F9; --line:#DCE2EC; --line2:#C9D1DE;
  --fg:#101828; --fg2:#3F4A5E; --fg3:#6B778C;
  --orange:#E0520A; --cyan:#0A86B5; --violet:#7A45D6; --green:#0D9E6E; --red:#D61F45; --yellow:#B98A00;
  --ok:#0D9E6E; --bad:#D61F45; --on-accent:#FFFFFF; --shadow:0 10px 30px -18px rgba(16,24,40,.35);
  --f-display:'Unbounded',ui-rounded,'Segoe UI',system-ui,sans-serif;
  --f-body:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A0E19; --bg2:#070A12; --panel:#121A2B; --panel2:#18213A; --line:#222D47; --line2:#2E3B5C;
  --fg:#EEF2FA; --fg2:#B5C0D6; --fg3:#7F8BA6;
  --orange:#FF6B1A; --cyan:#2EC4F1; --violet:#B98CFF; --green:#2EE6A6; --red:#FF4D6A; --yellow:#FFD23F;
  --ok:#2EE6A6; --bad:#FF4D6A; --on-accent:#0A0E19; --shadow:0 18px 40px -24px rgba(0,0,0,.8); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A0E19; --bg2:#070A12; --panel:#121A2B; --panel2:#18213A; --line:#222D47; --line2:#2E3B5C;
  --fg:#EEF2FA; --fg2:#B5C0D6; --fg3:#7F8BA6;
  --orange:#FF6B1A; --cyan:#2EC4F1; --violet:#B98CFF; --green:#2EE6A6; --red:#FF4D6A; --yellow:#FFD23F;
  --ok:#2EE6A6; --bad:#FF4D6A; --on-accent:#0A0E19; --shadow:0 18px 40px -24px rgba(0,0,0,.8); color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{margin:0;font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--c,var(--orange));outline-offset:2px;border-radius:8px}
.ic{width:20px;height:20px;flex:none}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{text-wrap:balance}
.mono{font-family:var(--f-mono)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;min-width:0}
.brand.pg{padding:5px 14px 5px 5px;border-radius:14px;border:1px solid transparent;transition:border-color .15s,background .15s,transform .15s;flex:none}
.brand.pg.on{border-color:var(--line2);background:var(--panel);box-shadow:inset 0 -2px 0 var(--orange)}
.brand.pg:not(.on):hover{border-color:var(--line2);background:var(--panel);transform:translateY(-1px)}
.brand.pg .mk{width:32px;height:32px;border-radius:9px}
.brand.pg .mk .ic{width:18px;height:18px}
.brand.pg b{font-size:13.5px}
.brand .mk{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--orange);color:var(--on-accent);flex:none}
.brand b{font-family:var(--f-display);font-size:15px;letter-spacing:.01em;white-space:nowrap}
.brand small{display:block;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;color:var(--fg3);text-transform:uppercase}
.top .sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-weight:700;font-size:13.5px;white-space:nowrap}
.chip .ic{width:17px;height:17px}
.chip.fire .ic{color:var(--orange)}
.chip.lv .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--yellow);color:var(--on-accent);font-size:12px;font-family:var(--f-mono)}
.iconbtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center}
@media (max-width:560px){.brand small,.chip.lv .t{display:none}}
@media (max-width:760px){.brand.man>span:last-child{display:none}.brand.man{padding:5px}}
@media (max-width:440px){.brand>span:last-child{display:none}.brand.pg{padding:5px}}
.games[data-n="6"]{grid-template-columns:repeat(3,1fr)}
.games[data-n="1"]{grid-template-columns:1fr}
.games[data-n="3"]{grid-template-columns:repeat(3,1fr)}
@media (max-width:820px){.games[data-n]{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}}
.mc .bk{hyphens:auto}

/* home */
main{padding-block:22px 60px}
.hero{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;align-items:stretch}
@media (max-width:820px){.hero{grid-template-columns:1fr}}
.daily{position:relative;overflow:hidden;border-radius:22px;padding:24px;background:linear-gradient(135deg,color-mix(in srgb,var(--orange) 22%,var(--panel)),var(--panel) 70%);border:1px solid color-mix(in srgb,var(--orange) 45%,var(--line));display:flex;flex-direction:column;gap:12px}
.daily .ey{font-family:var(--f-mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--orange);display:flex;align-items:center;gap:8px}
.daily h1{font-family:var(--f-display);font-size:clamp(26px,4.2vw,40px);line-height:1.05;margin:0;letter-spacing:-.01em}
.daily p{margin:0;color:var(--fg2);max-width:52ch}
.daily .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:auto;padding-top:6px}
.daily .ecg{position:absolute;right:-6px;top:16px;width:170px;height:46px;opacity:.35;color:var(--orange);pointer-events:none}
.daily .ecg path{stroke-dasharray:420;stroke-dashoffset:420;animation:ecg 3.2s linear infinite}
@keyframes ecg{to{stroke-dashoffset:-420}}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{border-radius:16px;padding:14px 16px;background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-family:var(--f-display);font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{color:var(--fg3);font-size:13px}
.stat .bar{margin-top:8px}
.stat.wide{grid-column:1/-1}
.bar{height:6px;border-radius:999px;background:var(--bg2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:inherit;background:var(--c,var(--orange));transition:width .4s ease}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--line2);background:var(--panel2);font-weight:800;font-size:15px;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--c,var(--fg3))}
.btn.pri{background:var(--c,var(--orange));border-color:var(--c,var(--orange));color:var(--on-accent)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.sm{height:36px;padding:0 13px;font-size:13.5px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:default}

.tray{margin-top:34px}
.tray>header{display:flex;align-items:baseline;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.tray h2{font-family:var(--f-display);font-size:clamp(19px,2.6vw,24px);margin:0}
.tray>header p{margin:0;color:var(--fg3);font-size:14px}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.game{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto 1fr auto;gap:6px 14px;padding:16px;border-radius:18px;background:var(--panel);border:1px solid var(--line);text-align:left;text-decoration:none;transition:transform .15s,border-color .15s}
.game:hover{border-color:var(--c);transform:translateY(-2px)}
.game .tile{grid-row:1/4;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c)}
.game b{font-family:var(--f-display);font-size:15px;line-height:1.25;font-weight:600}
.game small{color:var(--fg2);font-size:13.5px;line-height:1.4}
.game .meta{font-family:var(--f-mono);font-size:11.5px;color:var(--fg3)}

/* play shell */
.play{max-width:780px;margin:0 auto}
.ptop{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.ptop .ttl{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-size:17px;margin-right:auto;min-width:0}
.ptop .ttl .tile{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--c);color:var(--on-accent);flex:none}
.pill{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 11px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.pill .ic{width:15px;height:15px;color:var(--c)}
.pill.lives .ic{color:var(--red)}
.timer{height:8px;border-radius:999px;background:var(--panel2);overflow:hidden;margin-bottom:16px}
.timer i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--yellow),var(--red));background-size:300% 100%;transition:width .1s linear}
.card{border-radius:22px;border:1px solid var(--line2);background:var(--panel);padding:24px;box-shadow:var(--shadow)}
@media (max-width:520px){.card{padding:18px}}
.qk .ic{width:15px;height:15px;vertical-align:-2px;margin-right:4px}
.qk{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--c)}
.qq{font-family:var(--f-display);font-weight:600;font-size:clamp(17px,2.4vw,22px);line-height:1.3;margin:10px 0 18px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;padding:13px 15px;border-radius:14px;border:1px solid var(--line2);background:var(--panel2);font-size:15.5px;line-height:1.35;transition:transform .1s}
.opt:hover:not(:disabled){border-color:var(--c);transform:translateX(3px)}
.opt .k{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--bg2);font-family:var(--f-mono);font-weight:700;font-size:13px;flex:none}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,var(--panel2))}
.opt.ok .k{background:var(--ok);color:var(--on-accent)}
.opt.ko{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 13%,var(--panel2))}
.opt.ko .k{background:var(--bad);color:var(--on-accent)}
.opt:disabled{cursor:default}
.fb{margin-top:16px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.fb .msg{font-weight:800;display:flex;gap:8px;align-items:center}
.fb .msg.ok{color:var(--ok)} .fb .msg.ko{color:var(--bad)}
.fb .exp{flex:1 1 100%;display:flex;gap:10px;padding:12px 14px;border-radius:14px;background:color-mix(in srgb,var(--c) 9%,var(--panel2));border:1px solid color-mix(in srgb,var(--c) 28%,var(--line));color:var(--fg2);font-size:14.5px}
.fb .exp .ic{color:var(--yellow);margin-top:2px}
.fb .nx{margin-left:auto}

/* setup */
.setup h2{font-family:var(--f-display);font-size:22px;margin:0 0 4px}
.setup>p{color:var(--fg2);margin:0 0 16px}
.seg{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.seg button{height:36px;padding:0 13px;border-radius:999px;border:1px solid var(--line2);background:var(--panel);font-weight:700;font-size:13.5px}
.seg button.on{background:var(--c);border-color:var(--c);color:var(--on-accent)}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.li{display:flex;flex-direction:column;gap:4px;text-align:left;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:var(--panel);min-width:0}
.li:hover{border-color:var(--c)}
.li b{font-size:14.5px;line-height:1.3}
.li small{color:var(--fg3);font-size:12.5px}
.li .bar{height:4px;margin-top:6px}
.li.all{background:color-mix(in srgb,var(--c) 12%,var(--panel));border-color:color-mix(in srgb,var(--c) 40%,var(--line))}

/* result */
.res{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.res .big{font-family:var(--f-display);font-size:60px;line-height:1;color:var(--c)}
.res p{margin:0;color:var(--fg2)}
.res .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.fb .rf{flex:1 1 100%}
.rf{text-align:left;padding:12px 14px 13px;border-radius:14px;background:color-mix(in srgb,var(--cyan) 7%,var(--panel2));border:1px solid color-mix(in srgb,var(--cyan) 26%,var(--line));border-left-width:4px;font-size:14px;color:var(--fg2)}
.rf .rft{display:flex;align-items:center;gap:7px;font-family:var(--f-display);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg)}
.rf .rfs{display:flex;align-items:center;gap:6px;margin:6px 0 4px;font-size:12.5px;color:var(--fg3);font-weight:600}
.rf .rfs .ic,.rf summary .ic{width:14px;height:14px;flex:none}
.rf p{margin:0;line-height:1.55}
.rf mark{background:color-mix(in srgb,var(--yellow) 38%,transparent);color:inherit;border-radius:4px;padding:0 2px}
.rv div .rf{margin-top:8px;padding:8px 11px;background:var(--panel)}
.rf.mini summary{cursor:pointer;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--fg2);list-style:none}
.rf.mini summary::-webkit-details-marker{display:none}
.rf.mini[open] summary{margin-bottom:2px}
.rv{width:100%;text-align:left;display:grid;gap:8px;margin-top:10px}
.rv h3{font-family:var(--f-display);font-size:15px;margin:6px 0 0}
.rv div{padding:11px 13px;border-radius:12px;background:var(--panel2);font-size:14px}
.rv div b{color:var(--ok)}
.rv div em{display:block;font-style:normal;color:var(--fg3);font-size:13px;margin-top:4px}

/* V/F */
.vf{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.vf button{height:64px;border-radius:16px;border:2px solid;font-weight:800;font-size:17px;display:flex;align-items:center;justify-content:center;gap:10px;background:var(--panel2)}
.vf .t{border-color:var(--ok);color:var(--ok)} .vf .f{border-color:var(--bad);color:var(--bad)}
.vf button:hover{filter:brightness(1.08)}
.stmt .lbl{font-size:13px;color:var(--fg3);font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin-top:4px}
.stmt .ans{font-size:17px;font-weight:700;padding:12px 14px;border-radius:12px;background:var(--panel2);border:1px dashed var(--line2);margin-top:6px}
.flash-ok{animation:fok .35s} .flash-ko{animation:fko .35s}
@keyframes fok{50%{box-shadow:0 0 0 4px var(--ok)}} @keyframes fko{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* memory */
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:520px){.mem{grid-template-columns:repeat(3,1fr)}}
.mc{perspective:700px;border:0;background:none;padding:0;aspect-ratio:3/4;max-width:100%}
.mc .in{display:block;position:relative;width:100%;height:100%;transition:transform .4s;transform-style:preserve-3d}
.mc.on .in,.mc.done .in{transform:rotateY(180deg)}
.mc .fa,.mc .bk{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:grid;place-items:center;padding:8px;border:1px solid var(--line2)}
.mc .fa{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--c) 22%,var(--panel)) 0 10px,var(--panel) 10px 20px);color:var(--c)}
.mc .fa .ic{width:28px;height:28px}
.mc .bk{transform:rotateY(180deg);background:var(--panel2);font-size:12.5px;line-height:1.25;text-align:center;overflow:hidden;overflow-wrap:anywhere}
.mc .bk.key{font-family:var(--f-mono);font-weight:700;font-size:15px;color:var(--c)}
.mc.done .bk{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--panel2))}

/* match columns */
.cols{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:10px}
.cols .col{display:grid;gap:8px;align-content:start}
.mt{min-height:54px;padding:10px 12px;border-radius:12px;border:1px solid var(--line2);background:var(--panel2);text-align:left;font-size:13.5px;line-height:1.3;overflow-wrap:anywhere}
.mt.key{font-family:var(--f-mono);font-weight:700;font-size:14px}
.mt.sel{border-color:var(--c);box-shadow:0 0 0 2px var(--c)}
.mt.done{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,var(--panel2));color:var(--fg3);cursor:default}
.mt.bad{animation:fko .35s;border-color:var(--bad)}

/* type */
.typ{display:flex;gap:10px;flex-wrap:wrap}
.typ input{flex:1 1 200px;min-width:0;height:52px;border-radius:12px;border:1px solid var(--line2);background:var(--panel2);color:var(--fg);font-family:var(--f-mono);font-size:20px;padding:0 14px}
.typ input:focus{outline:2px solid var(--c);outline-offset:1px}

/* order */
.ord{display:grid;gap:8px}
.ord .slot{display:flex;gap:10px;align-items:center;min-height:50px;padding:10px 12px;border-radius:12px;border:1px dashed var(--line2);color:var(--fg3);font-size:14.5px}
.ord .slot.fill{border-style:solid;background:var(--panel2);color:var(--fg);cursor:pointer}
.ord .slot .n{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--bg2);font-family:var(--f-mono);font-weight:700;font-size:13px;flex:none}
.ord .slot.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,var(--panel2))}
.ord .slot.ok .n{background:var(--ok);color:var(--on-accent)}
.ord .slot.ko{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 11%,var(--panel2))}
.ord .slot.ko .n{background:var(--bad);color:var(--on-accent)}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.pool button{padding:10px 12px;border-radius:12px;border:1px solid var(--c);background:color-mix(in srgb,var(--c) 10%,var(--panel));font-size:14px;text-align:left;max-width:100%}

/* classify */
.item{font-family:var(--f-display);font-weight:600;font-size:clamp(17px,2.6vw,22px);line-height:1.3;text-align:center;padding:26px 16px;border-radius:16px;background:var(--panel2);border:1px solid var(--line2);margin:10px 0 14px}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.bins button{min-height:56px;padding:10px;border-radius:14px;border:1px solid var(--line2);background:var(--panel);font-weight:800;font-size:14.5px;line-height:1.25}
.bins button:hover:not(:disabled){border-color:var(--c)}
.bins button.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,var(--panel))}
.bins button.ko{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--panel))}

/* flashcards */
.fc{perspective:1200px;width:100%;border:0;background:none;padding:0;min-height:260px;display:block}
.fc .in{display:block;position:relative;min-height:260px;transition:transform .5s;transform-style:preserve-3d}
.fc.on .in{transform:rotateY(180deg)}
.fc .fa,.fc .bk{position:absolute;inset:0;border-radius:22px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;padding:24px;text-align:center;border:1px solid var(--line2);background:var(--panel);box-shadow:var(--shadow);overflow:auto}
.fc .bk{transform:rotateY(180deg);background:color-mix(in srgb,var(--c) 8%,var(--panel))}
.fc .main{font-family:var(--f-display);font-weight:600;font-size:clamp(17px,2.6vw,23px);line-height:1.3}
.fc .main.key{font-family:var(--f-mono);font-size:clamp(26px,5vw,40px);color:var(--c)}
.fc .hint{font-size:12.5px;color:var(--fg3);font-family:var(--f-mono);letter-spacing:.1em;text-transform:uppercase}
.fc .sub{color:var(--fg2);font-size:14.5px;max-width:52ch}
.boxes{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:14px 0 4px}
.boxes div{border-radius:10px;background:var(--panel);border:1px solid var(--line);padding:6px;text-align:center;font-size:11.5px;color:var(--fg3)}
.boxes b{display:block;font-family:var(--f-mono);font-size:16px;color:var(--fg)}
.rate{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}


/* ordena (arrastrar) */
.sort{display:grid;gap:8px}
.si{display:flex;align-items:center;gap:10px;min-height:52px;padding:8px 8px 8px 10px;border-radius:12px;border:1px solid var(--line2);background:var(--panel2);font-size:14.5px;line-height:1.3;user-select:none;-webkit-user-select:none;cursor:grab;position:relative}
.si.drag{z-index:5;box-shadow:0 14px 30px -12px rgba(0,0,0,.5);border-color:var(--c);cursor:grabbing;background:var(--panel)}
.si .n{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--bg2);font-family:var(--f-mono);font-weight:700;font-size:13px;flex:none}
.si .tx{flex:1;min-width:0}
.si .mv{display:flex;gap:4px;flex:none}
.si .mv button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line2);background:var(--panel);display:grid;place-items:center;padding:0}
.si .mv .ic{width:18px;height:18px}
.si .gr{color:var(--fg3);touch-action:none;padding:8px 4px;cursor:grab;display:grid;place-items:center;flex:none}
.sort.done .si{cursor:default}
.si.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,var(--panel2))}
.si.ok .n{background:var(--ok);color:var(--on-accent)} .si.ok>.ic{color:var(--ok)}
.si.ko{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 11%,var(--panel2))}
.si.ko .n{background:var(--bad);color:var(--on-accent)}
.si .should{font-size:12px;font-weight:700;color:var(--bad);white-space:nowrap}
@media (max-width:520px){.si .mv button{width:30px;height:30px}.si{gap:8px}}
/* repaso de hoy */
.today{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:space-between;padding:16px;border-radius:16px;background:color-mix(in srgb,var(--c) 10%,var(--panel));border:1px solid color-mix(in srgb,var(--c) 35%,var(--line))}
.today b{display:block;font-family:var(--f-display);font-size:16px;line-height:1.3}
.today small{color:var(--fg2);font-size:13.5px}
/* qué código */
.codes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.codes>*{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:10px 12px;border-radius:12px;border:1px solid var(--line2);background:var(--panel)}
.codes b{font-family:var(--f-mono);font-size:13.5px;color:var(--c,var(--orange))}
.codes small{font-size:12px;color:var(--fg3);line-height:1.25}
.codes button:hover:not(:disabled){border-color:var(--c)}
.codes button.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,var(--panel))}
.codes button.ko{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--panel))}
.codes button:disabled{cursor:default}
.codes.ref>*{background:var(--panel2)}
.item.left{text-align:left;font-size:clamp(16px,2.2vw,19px);padding:18px}
/* triaje */
.tri-info{display:grid;gap:8px;margin:4px 0 16px}
.tri-info div{display:flex;gap:10px;font-size:14.5px;color:var(--fg2);line-height:1.45}
.tri-info .ic{color:var(--c);margin-top:2px}
.tri-info b{color:var(--fg)}
.tri-b{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.tri-b>*{display:flex;flex-direction:column;gap:3px;padding:12px;border-radius:14px;border:2px solid var(--c);background:color-mix(in srgb,var(--c) 9%,var(--panel));text-align:left}
.tri-b b{color:var(--c);font-weight:800;font-size:15px}
.tri-b small{font-size:12.5px;color:var(--fg2);line-height:1.3}
.tri-b.pick button{min-height:72px}
.tri-b.pick button:hover:not(:disabled){filter:brightness(1.08)}
.tri-b.pick button:disabled{cursor:default;opacity:.55}
.tri-b.pick button.ok{opacity:1;box-shadow:0 0 0 3px var(--ok)}
.tri-b.pick button.ko{opacity:1;box-shadow:0 0 0 3px var(--bad)}
.victim{display:flex;gap:12px;align-items:flex-start;margin:10px 0 12px}
.victim .vn{width:38px;height:38px;border-radius:50%;background:var(--c);color:var(--on-accent);display:grid;place-items:center;font-family:var(--f-mono);font-weight:700;flex:none}
.victim p{margin:0;font-family:var(--f-display);font-weight:600;font-size:clamp(16px,2.2vw,19px);line-height:1.35}
.vit{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px;margin:0 0 14px}
.vit b{overflow-wrap:anywhere}
.vit div{padding:8px 10px;border-radius:10px;background:var(--panel2);border:1px solid var(--line)}
.vit small{display:block;font-size:11px;color:var(--fg3);text-transform:uppercase;letter-spacing:.08em;font-family:var(--f-mono)}
.vit b{font-size:15px}
.vit .al{border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.vit .al b{color:var(--bad)}
/* casos */
.case-intro{margin:8px 0 12px;padding:12px 14px;border-radius:12px;background:var(--panel2);color:var(--fg2);font-size:15px;line-height:1.5}
.cons{display:flex;gap:10px;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--bad) 10%,var(--panel2));border:1px solid color-mix(in srgb,var(--bad) 35%,var(--line));font-size:14.5px;margin:10px 0}
.cons .ic{color:var(--bad);margin-top:1px}
.pop{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);font-family:var(--f-display);font-size:40px;color:var(--yellow);pointer-events:none;animation:pop .8s ease forwards;z-index:95;text-shadow:0 4px 30px rgba(0,0,0,.35)}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}30%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-90%) scale(1)}}
.empty{padding:22px;border-radius:16px;border:1px dashed var(--line2);color:var(--fg2);text-align:center}
footer{border-top:1px solid var(--line);color:var(--fg3);font-size:13px}
footer .wrap{padding-block:18px}
.fade{animation:fade .25s ease}
@keyframes fade{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<script id="gdata" type="application/json">/*GDATA*/</script>
<script>
const G=JSON.parse(document.getElementById('gdata').textContent);
const ICONS=/*ICONS*/;
/* iconos usados de forma dinámica: ic('radio') ic('hash') ic('siren') ic('users') ic('map-pin') ic('book-a') ic('pill') ic('baby') ic('heart-pulse') ic('activity') ic('thermometer') ic('wind') ic('car') ic('shield-check') ic('gauge') ic('brain') ic('clipboard-list') ic('headset') ic('heart-handshake') ic('heart') ic('briefcase-medical') ic('syringe') ic('file-text') ic('flame') ic('layers') ic('sun') ic('moon') ic('plus') */
const $=s=>document.querySelector(s), app=$('#app');
const ic=(n,c='')=>`<svg class="ic ${c}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]||''}</svg>`;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const nz=s=>String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const hsh=s=>{let h=5381;for(let i=0;i<s.length;i++)h=(h*33^s.charCodeAt(i))>>>0;return h.toString(36)};
const clip=(s,n)=>s.length>n?s.slice(0,n).replace(/\s\S*$/,'')+'…':s;
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const COL={admin:'--violet',central:'--cyan',operativos:'--orange',psico:'--violet',sva:'--red',svb:'--yellow',tecnicas:'--green'};
const cv=v=>`style="--c:var(${v})"`;
const AICON={admin:'clipboard-list',central:'headset',operativos:'siren',psico:'heart-handshake',sva:'heart',svb:'briefcase-medical',tecnicas:'syringe'};

/* ---------- estado (solo en este navegador) ---------- */
let S={xp:0,ok:{},wrong:{},best:{},days:[],daily:'',lt:{},played:0};
try{const s=JSON.parse(localStorage.getItem('samurpc-juegos-v1')||'null');if(s)S=Object.assign(S,s)}catch(e){}
const save=()=>{try{localStorage.setItem('samurpc-juegos-v1',JSON.stringify(S))}catch(e){}};
const RANKS=[[0,'Aspirante'],[60,'Voluntario/a PC'],[180,'TATS'],[400,'Enfermero/a'],[750,'Médico/a SVA'],[1200,'Charly'],[1800,'Supervisor/a'],[2600,'Directivo/a de Guardia']];
function rank(){let i=0;RANKS.forEach((r,k)=>{if(S.xp>=r[0])i=k});return{i,cur:RANKS[i],nx:RANKS[i+1]}}
function streak(){const ds=[...new Set(S.days)].sort();let n=0;let d=new Date();const key=x=>x.toISOString().slice(0,10);
  const has=k=>ds.includes(k);const loc=x=>{const y=new Date(x);return y.getFullYear()+'-'+String(y.getMonth()+1).padStart(2,'0')+'-'+String(y.getDate()).padStart(2,'0')};
  if(!has(loc(d))){d.setDate(d.getDate()-1);if(!has(loc(d)))return 0}
  while(has(loc(d))){n++;d.setDate(d.getDate()-1)}return n}
function addXP(n){S.xp=Math.max(0,S.xp+n);const t=today();if(!S.days.includes(t)){S.days.push(t);S.days=S.days.slice(-400)}save();drawTop()}
function drawTop(){const r=rank();$('#level').innerHTML=`<span class="n">${r.i+1}</span><span class="t">${esc(r.cur[1])} · </span>${S.xp} XP`;$('#streak').innerHTML=`${ic('flame')}${streak()} ${streak()===1?'día':'días'}`}
function popup(t){const d=document.createElement('div');d.className='pop';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),850)}

/* ---------- datos: preguntas ---------- */
const AMB={};G.tree.forEach(a=>AMB[a.id]=a);
const REF={};
G.sets.forEach(s=>{s.qs=s.q.map(([q,a,d,e,r])=>{const id=s.id+'|'+hsh(q);if(r>=0)REF[id]=G.refs[r];return{id,k:s.t,q,a,d,e,amb:s.amb}})});
const ALLQ=G.sets.flatMap(s=>s.qs);
G.exams.forEach(x=>{x.qs=x.q.map(([n,q,o,c,r])=>({id:(r>=0&&(REF['ex.'+x.id+'|'+n]=G.refs[r]),'ex.'+x.id+'|'+n),k:x.t+' · pregunta '+n,q,a:o[c],o,fixed:1,e:`Respuesta correcta según la plantilla oficial: ${'abc'[c]})`}))});
/* refuerzo: párrafo del temario donde sale la respuesta, con sus palabras resaltadas */
const fold=w=>w.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
function refHTML(id,ans,mini){const r=REF[id];if(!r)return'';const[pt,h,x]=r;
  const keys=new Set((fold(ans||'').match(/[a-z0-9ñ]+(?:[.,][0-9]+)?/g)||[]).filter(w=>w.length>3||/\d/.test(w)));
  const body=esc(x).replace(/[A-Za-zÀ-ÿ0-9]+(?:[.,][0-9]+)?/g,w=>keys.has(fold(w))?`<mark>${w}</mark>`:w);
  const src=`<span class="rfs">${ic('book-open')}${esc(pt)}${h?' › '+esc(h):''}</span>`;
  return mini?`<details class="rf mini"><summary>${ic('book-open')}Ver en el temario</summary>${src}<p>${body}</p></details>`
             :`<div class="rf"><div class="rft">${ic('book-open')}Del temario</div>${src}<p>${body}</p></div>`}
const okN=l=>l.filter(x=>S.ok[x.id]).length;

/* ---------- mazos de parejas ---------- */
const uniq=p=>{const sk=new Set(),sv=new Set();return p.filter(([k,v])=>{const a=nz(k),b=nz(v);if(sk.has(a)||sv.has(b))return false;sk.add(a);sv.add(b);return true})};
const DECKS=[
 {id:'claves',t:'Claves de radio',icon:'radio',c:'--cyan',kind:'Clave',typ:1,p:G.claves},
 {id:'codigos',t:'Códigos de incidente',icon:'hash',c:'--orange',kind:'Código',typ:1,p:G.codigos.map(x=>[x[0],x[1]])},
 {id:'esp',t:'Códigos específicos',icon:'siren',c:'--red',kind:'Código',typ:1,p:G.esp},
 {id:'ind',t:'Indicativos',icon:'users',c:'--violet',kind:'Indicativo',typ:1,p:G.ind},
 {id:'bases',t:'Bases SAMUR',icon:'map-pin',c:'--green',kind:'Base',p:G.bases},
 {id:'abbr',t:'Abreviaturas',icon:'book-a',c:'--yellow',kind:'Sigla',typ:1,p:G.abbr},
 {id:'drugs',t:'Fármacos y su función',icon:'pill',c:'--violet',kind:'Fármaco',p:G.drugs},
 {id:'tep',t:'Triángulo de Evaluación Pediátrica',icon:'baby',c:'--yellow',kind:'Lados alterados',p:[['Solo el aspecto','Disfunción del SNC o problema sistémico'],['Solo la respiración','Dificultad respiratoria'],['Solo la circulación','Shock compensado'],['Aspecto y respiración','Insuficiencia respiratoria, parada inminente'],['Aspecto y circulación','Shock descompensado'],['Los tres lados','Insuficiencia cardiorrespiratoria, PCR']]},
 {id:'killip',t:'Clasificación Killip',icon:'heart-pulse',c:'--red',kind:'Killip',p:[['Killip I','Sin evidencia de insuficiencia cardiaca'],['Killip II','Crepitantes en la mitad inferior de los campos pulmonares'],['Killip III','Edema agudo de pulmón'],['Killip IV','Shock cardiogénico']]},
 {id:'cormack',t:'Laringoscopia Cormack-Lehane',icon:'activity',c:'--cyan',kind:'Grado',p:[['Grado I','Glotis visible con comisura anterior y posterior'],['Grado II','Solo el aspecto posterior de la glotis'],['Grado III','Solo la epiglotis'],['Grado IV','Solo el paladar duro']]},
 {id:'pulsos',t:'Pulsos y TAS estimada',icon:'activity',c:'--red',kind:'Pulso',p:[['Pulso radial presente','TAS mayor de 80 mmHg'],['Pulso femoral presente','TAS mayor de 70 mmHg'],['Pulso carotídeo presente','TAS mayor de 60 mmHg']]},
 {id:'hipo',t:'Grados de hipotermia',icon:'thermometer',c:'--cyan',kind:'Grado',p:[['Hipotermia leve','De 32 a 35 ºC'],['Hipotermia moderada','De 28 a 32 ºC'],['Hipotermia grave','Menos de 28 ºC']]},
 {id:'cohb',t:'Cooximetría (COHb) y clínica',icon:'wind',c:'--orange',kind:'COHb',p:[['COHb < 10 %','Asintomático'],['COHb 10-20 %','Asintomático o cefalea'],['COHb 20-30 %','Mareo, vértigo, náuseas, vómitos, disnea'],['COHb 30-40 %','Alteraciones visuales'],['COHb 40-50 %','Confusión, desorientación, síncope'],['COHb > 50 %','Coma, disfunción cardiopulmonar, exitus']]},
 {id:'atrap',t:'Niveles de atrapamiento',icon:'car',c:'--orange',kind:'Nivel',p:[['Mecánico','No puede salir por el colapso de las puertas'],['Físico I','No puede salir debido a sus lesiones'],['Físico II','Sus lesiones y el colapso de elementos sobre la víctima']]},
 {id:'prio',t:'Prioridades de la Central',icon:'siren',c:'--red',kind:'Prioridad',p:[['P1','Emergencia: urgencia vital, activación en emergencia'],['P2','Urgencia no vital, activación en emergencia'],['P3','Preferente: no vital con condicionante social'],['P4','Normal: no urgencia, sin activación en emergencia']]},
 {id:'perfiles',t:'Perfiles SAMUR Social',icon:'users',c:'--violet',kind:'Perfil',p:[['Perfil A','Mayor de 18 y menor de 65, sin domicilio, ciudadano UE'],['Perfil B','Mayor de 65, sin domicilio o sin poder comunicarlo, ciudadano UE'],['Perfil C','Mayor de 18, sin domicilio, no ciudadano UE'],['Perfil D','Menor de 18 años sin alojamiento']]},
 {id:'ramsay',t:'Escala de Ramsay',icon:'brain',c:'--violet',kind:'Nivel',p:[['Ramsay 1','Despierto, ansioso o agitado'],['Ramsay 2','Despierto, tranquilo, orientado y colaborador'],['Ramsay 3','Despierto, pero solo responde a órdenes'],['Ramsay 4','Dormido con respuesta rápida a órdenes'],['Ramsay 5','Dormido con respuesta tardía'],['Ramsay 6','Sin respuesta']]},
 {id:'apgar',t:'Test de Apgar',icon:'baby',c:'--green',kind:'Puntuación',p:[['Apgar 0-3','Depresión severa'],['Apgar 4-6','Depresión moderada'],['Apgar 7-10','Recién nacido en buenas condiciones']]},
 {id:'fcped',t:'FC normal por edad (niño)',icon:'heart-pulse',c:'--yellow',kind:'Edad',p:[['1 mes','100-180 lpm'],['1 año','100-170 lpm'],['5 años','70-140 lpm'],['10 años','60-120 lpm']]},
];
DECKS.forEach(d=>{d.p=uniq(d.p);d.cards=d.p.map(([k,v])=>({id:'dk.'+d.id+'|'+hsh(k),k,v}))});
const DK={};DECKS.forEach(d=>DK[d.id]=d);
const BIG=DECKS.filter(d=>d.p.length>=10), SMALL=DECKS.filter(d=>d.p.length<10);

/* ---------- secuencias para ordenar ---------- */
const SEQ=[
 {t:'Liberación de una víctima atrapada',src:'Coordinación con Bomberos',s:['Consolidación: estabilizar el vehículo','Accesibilidad: abrir huecos para los sanitarios','Estabilización médica de la víctima','Liberación: corte y separación por Bomberos','Extracción coordinada de la víctima']},
 {t:'Asistencia al politraumatizado (SVB)',src:'Valoración inicial del paciente politraumatizado',s:['Valoración de la escena','Estimación inicial de gravedad','Valoración primaria y soporte vital','Traslado primario a la unidad','Valoración secundaria y estabilización','Traslado a centro útil o transferencia a SVA']},
 {t:'Grupos de actuaciones en el trauma',src:'Valoración inicial del paciente politraumatizado',s:['Vía aérea con control cervical, collarín y hemorragias masivas','Respiración, circulación, TA y faja pélvica si procede','Valoración neurológica: pupilas, Glasgow, sensibilidad y movilidad']},
 {t:'Valoración inicial del adulto (SVB)',src:'Valoración del paciente adulto',s:['Nivel de conciencia (AVDN)','Estado respiratorio','Estado circulatorio','Estado neurológico','Exposición']},
 {t:'Valoración del niño grave',src:'Valoración del niño grave',s:['Estimación inicial con el TEP (30-60 s)','Valoración primaria ABCDE','Valoración secundaria: historia dirigida y exploración']},
 {t:'Niveles de la reanimación neonatal',src:'Asistencia al recién nacido',s:['Pasos iniciales y estabilización','Ventilación','Masaje cardiaco','Medicación y fluidos']},
 {t:'Triaje STARS en un IMV',src:'Incidentes con múltiples víctimas',s:['1er triaje: rescate en el foco','2º triaje: asistencia en zona templada','3er triaje: estabilización en el PSA']},
 {t:'Fases del atropello',src:'Valoración inicial del paciente politraumatizado',s:['Golpe con el parachoques: miembros inferiores','Golpe contra capó y parabrisas: TCE, tórax, abdomen','Caída al suelo: lesiones impredecibles']},
 {t:'Tratamiento del estatus epiléptico',src:'Crisis / Estatus epiléptico',s:['Monitorización y resucitación inicial','1ª línea: benzodiacepinas','2ª línea: levetiracetam','3ª línea: coma farmacológico']},
 {t:'Inserción de la cánula de Guedel (adulto)',src:'Permeabilización básica de la vía aérea',s:['Limpiar boca y faringe de secreciones','Medir de la comisura bucal al ángulo mandibular','Introducir invertida por el paladar duro','Rotar 180º y terminar la inserción']},

function deckMCQ(d,c){const k=Math.random()<.55;const others=shuf(d.cards.filter(x=>x!==c)).slice(0,3);
  return k?{id:c.id,k:d.t,q:`${d.kind} «${c.k}»: ¿qué es?`,a:c.v,d:others.map(x=>x.v)}:{id:c.id,k:d.t,q:`«${clip(c.v,140)}» ¿a qué corresponde?`,a:c.k,d:others.map(x=>x.k)}}
const pick=(pool,n)=>{const s=shuf(pool);return[...s.filter(x=>!S.ok[x.id]),...s.filter(x=>S.ok[x.id])].slice(0,n)};
let T=null,TT=null;const stopT=()=>{clearInterval(TT);TT=null};
function frame(c,icon,title,right=''){return `<div class="play fade" ${cv(c)}><div class="ptop"><span class="ttl"><span class="tile">${ic(icon)}</span>${esc(title)}</span>${right}<a class="btn sm" href="#inicio">${ic('x')}Salir</a></div><div id="pb"></div></div>`}
function runMCQ(cfg){stopT();
  T={...cfg,i:0,ok:0,score:0,streak:0,best:0,wrong:[],lives:cfg.lives||0};T.items=(cfg.items||[]).map(x=>({...x,opts:null}));
  app.innerHTML=frame(cfg.c,cfg.icon,cfg.title,`${cfg.timer?'<span class="pill" id="tl"></span>':''}<span class="pill" id="pp"></span>${cfg.lives?'<span class="pill lives" id="pl"></span>':''}<span class="pill" id="ps"></span>`);
  nextQ()}
function nextQ(){stopT();const t=T;
  if(t.gen&&t.lives<=0)return endMCQ();
  let it=t.items[t.i];if(!it&&t.gen){it=t.gen();t.items.push(it)}
  if(!it)return endMCQ();
  if(!it.opts)it.opts=it.fixed?it.o:shuf([it.a,...it.d]);
  $('#pp').innerHTML=`${ic('list-ordered')}${t.i+1}${t.gen?'':' / '+t.items.length}`;
  $('#ps').innerHTML=`${ic('star')}${t.score}`;if(t.lives)$('#pl').innerHTML=ic('heart').repeat(t.lives);
  $('#pb').innerHTML=`${t.timer?'<div class="timer"><i id="tb" style="width:100%"></i></div>':''}<div class="card"><div class="qk">${esc(it.k)}</div><div class="qq">${esc(it.q)}</div>
   <div class="opts">${it.opts.map((o,k)=>`<button class="opt" data-k="${k}"><span class="k">${'ABCD'[k]}</span><span>${esc(o)}</span></button>`).join('')}</div><div class="fb" id="fb"></div></div>`;
  const tm=typeof t.timer==='function'?t.timer(it):t.timer;const t0=performance.now();let done=false;
  const ans=k=>{if(done)return;done=true;stopT();const good=it.opts.indexOf(it.a);
    document.querySelectorAll('.opt').forEach((b,j)=>{b.disabled=true;if(j===good)b.classList.add('ok');if(j===k&&k!==good)b.classList.add('ko')});
    const right=k===good;let msg;
    if(right){t.ok++;t.streak++;t.best=Math.max(t.best,t.streak);const pts=10+(tm?Math.max(0,Math.round((tm-(performance.now()-t0)/1000)/2)):0)+(t.streak>=3?5:0);t.score+=pts;S.ok[it.id]=1;if(S.wrong[it.id]){delete S.wrong[it.id]}msg=`<span class="msg ok">${ic('circle-check')}¡Correcto!${t.streak>=3?' Racha x'+t.streak:''}</span>`}
    else{t.streak=0;t.wrong.push(it);S.wrong[it.id]={id:it.id,k:it.k,q:it.q,a:it.a,d:it.d||[],o:it.fixed?it.o:null,e:it.e||''};if(t.lives)t.lives--;msg=`<span class="msg ko">${ic('circle-x')}${k<0?'Se acabó el tiempo':'Incorrecto'}</span>`}
    save();$('#ps').innerHTML=`${ic('star')}${t.score}`;if($('#pl'))$('#pl').innerHTML=t.lives>0?ic('heart').repeat(t.lives):'Sin vidas';
    const last=(!t.gen&&t.i+1>=t.items.length)||(!!t.gen&&t.lives<=0);
    $('#fb').innerHTML=msg+(it.e?`<div class="exp">${ic('lightbulb')}<span>${esc(it.e)}</span></div>`:(!right?`<div class="exp">${ic('lightbulb')}<span>Respuesta correcta: <b>${esc(it.a)}</b></span></div>`:''))+(!right?refHTML(it.id,it.a):'')+`<button class="btn sm pri nx" id="nx">${last?'Ver resultado':'Siguiente'}${ic('arrow-right')}</button>`;
    $('#nx').onclick=()=>{t.i++;nextQ()};$('#nx').focus();
  };
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>ans(+b.dataset.k));
  if(tm){TT=setInterval(()=>{const el=(performance.now()-t0)/1000,tb=$('#tb');if(!tb){stopT();return}tb.style.width=Math.max(0,100-el/tm*100)+'%';tb.style.backgroundPosition=(el/tm*100)+'% 0';const tl=$('#tl');if(tl)tl.textContent=Math.ceil(tm-el)+' s';if(el>=tm)ans(-1)},100)}
}
function endMCQ(){stopT();const t=T;const n=t.gen?t.i+(t.lives>0?0:1):t.items.length;const total=t.gen?t.ok+t.wrong.length:t.items.length;
  let xp=t.ok*2+(t.ok===total&&total>=5?10:0);if(t.onDone)xp+=t.onDone(t)||0;addXP(xp);S.played++;
  const rec=t.key&&t.score>(S.best[t.key]||0);if(rec)S.best[t.key]=t.score;save();
  const nota=total?(t.ok/total*10):0;
  $('#pb').innerHTML=`<div class="card res fade"><div class="qk">${ic('trophy')} Resultado</div><div class="big">${t.gen?t.ok:t.ok+'/'+total}</div>
   <p>${t.gen?'preguntas acertadas antes de quedarte sin vidas':`${t.ok} aciertos · nota ${nota.toFixed(1).replace('.',',')} sobre 10`} · mejor racha ${t.best} · <b>+${xp} XP</b>${rec?' · ¡nuevo récord!':''}</p>
   <div class="row"><button class="btn pri" id="again">${ic('rotate-ccw')}Otra ronda</button><a class="btn" href="#inicio">${ic('house')}Inicio</a></div>
   ${t.wrong.length?`<div class="rv"><h3>Para repasar (${t.wrong.length})</h3>${t.wrong.map(w=>`<div>${esc(w.q)}<br>→ <b>${esc(w.a)}</b>${w.e?`<em>${esc(w.e)}</em>`:''}${refHTML(w.id,w.a,1)}</div>`).join('')}</div>`:''}</div>`;
  $('#again').onclick=()=>t.again();if(t.ok===total&&total>=5)popup('¡Pleno!');}

  const tiles=shuf(cs.flatMap(c=>[{c,key:1,txt:c.k},{c,key:0,txt:clip(c.v,90)}]));let open=[],moves=0,found=0,lock=false;const t0=Date.now();

          setTimeout(()=>{$('#pb').innerHTML=`<div class="card res fade" ${cv(d.c)}><div class="qk">${ic('trophy')} ¡Todas encontradas!</div><div class="big">${moves}</div><p>intentos en ${secs} s · <b>+${xp} XP</b>${rec?' · ¡mejor marca en este mazo!':''}</p><div class="row"><button class="btn pri" id="again">${ic('rotate-ccw')}Otra partida</button><button class="btn" id="other">${ic('layers')}Otro mazo</button></div><div class="rv"><h3>Las parejas de esta partida</h3>${cs.map(c=>`<div><b>${esc(c.k)}</b> — ${esc(c.v)}</div>`).join('')}</div></div>`;$('#again').onclick=()=>playPairs(d);$('#other').onclick=vPairs},500)}}

/* ordena: arrastra los pasos (o usa las flechas) hasta dejarlos en orden */
function vOrder(){app.innerHTML=frame('--cyan','list-ordered','Ordena los pasos');

  $('#pb').innerHTML=`<div class="setup"><h2>Elige una secuencia</h2><p>Los pasos salen desordenados. Arrástralos desde el asa ${ic('grip-vertical')} (o usa las flechas) hasta dejarlos en el orden correcto y pulsa Comprobar. Llevas ${done} de ${SEQ.length} superadas.</p><div class="list" ${cv('--cyan')}>${SEQ.map((s,k)=>`<button class="li" data-q="${k}"><b>${esc(s.t)}</b><small>${s.s.length} pasos · ${esc(s.src)}${S.best['ord.'+k]?' · '+ic('check')+' superada':''}</small></button>`).join('')}</div></div>`;
  document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>playOrder(+b.dataset.q))}
function playOrder(k){const s=SEQ[k];let ord=shuf(s.s.map((x,i)=>i));
  if(s.s.length>1)while(ord.every((p,i)=>p===i))ord=shuf(ord);

  const draw=(checked)=>{const perfect=checked&&ord.every((p,i)=>p===i);
    $('#pb').innerHTML=`<div class="card"><div class="qk">${esc(s.src)}</div><div class="qq">${checked?(perfect?'¡Orden perfecto!':'Así lo has dejado'):'Ordena los '+s.s.length+' pasos'}</div>

    <div class="fb">${checked?`${perfect?`<span class="msg ok">${ic('circle-check')}+5 XP</span>`:`<span class="msg ko">${ic('circle-x')}${ord.filter((p,i)=>p===i).length} de ${s.s.length} en su sitio</span><div class="exp">${ic('lightbulb')}<span>Orden correcto: ${s.s.map((x,i)=>`<b>${i+1}.</b> ${esc(x)}`).join(' · ')}</span></div>`}<button class="btn sm" id="rt">${ic('rotate-ccw')}Repetir</button><button class="btn sm pri nx" id="nx">Otra secuencia${ic('arrow-right')}</button>`:`<button class="btn sm pri nx" id="ck">${ic('check')}Comprobar</button>`}</div></div>`;
    if(checked){$('#rt').onclick=()=>playOrder(k);$('#nx').onclick=()=>playOrder((k+1)%SEQ.length);return}
    const sl=$('#sl');
    const sync=()=>{ord=[...sl.children].map(e=>+e.dataset.p);[...sl.children].forEach((e,i)=>e.querySelector('.n').textContent=i+1)};
    sl.querySelectorAll('.up').forEach(b=>b.onclick=()=>{const el=b.closest('.si');if(el.previousElementSibling){sl.insertBefore(el,el.previousElementSibling);sync();b.focus()}});
    sl.querySelectorAll('.dn').forEach(b=>b.onclick=()=>{const el=b.closest('.si');if(el.nextElementSibling){sl.insertBefore(el.nextElementSibling,el);sync();b.focus()}});
    sl.querySelectorAll('.si').forEach(el=>{
      el.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;if(e.pointerType!=='mouse'&&!e.target.closest('.gr'))return;
        e.preventDefault();el.setPointerCapture(e.pointerId);let y0=e.clientY;el.classList.add('drag');
        const mv=ev=>{let dy=ev.clientY-y0;const pv=el.previousElementSibling,nx=el.nextElementSibling;
          if(nx&&dy>nx.offsetHeight/2){sl.insertBefore(nx,el);y0+=nx.offsetHeight+8;dy=ev.clientY-y0}
          else if(pv&&dy<-pv.offsetHeight/2){sl.insertBefore(el,pv);y0-=pv.offsetHeight+8;dy=ev.clientY-y0}
          el.style.transform=`translateY(${dy}px)`};
        const up=()=>{el.classList.remove('drag');el.style.transform='';el.removeEventListener('pointermove',mv);el.removeEventListener('pointerup',up);el.removeEventListener('pointercancel',up);sync()};
        el.addEventListener('pointermove',mv);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up)})});
    $('#ck').onclick=()=>{sync();const ok=ord.every((p,i)=>p===i);if(ok){addXP(5);S.best['ord.'+k]=1;save();popup('+5 XP')}else{const n=ord.filter((p,i)=>p===i).length;addXP(Math.max(0,n-1))}draw(true)}};draw()}

function playFlash(x){const now=Date.now();const due=x.cards.filter(c=>{const s=stOf(c)[c.id];return !s||s.due<=now});
  const seen=due.filter(c=>stOf(c)[c.id]).sort((a,b)=>stOf(a)[a.id].box-stOf(b)[b.id].box||Math.random()-.5);

  app.innerHTML=frame(x.c,'layers-2',x.t,`<span class="pill" id="fp"></span>`);

    const c=queue[i];const s0=stOf(c)[c.id];$('#fp').innerHTML=`${ic('list-ordered')}${i+1} / ${queue.length}`;

      <div class="rate" id="rt" hidden><button class="btn" id="no" style="--c:var(--bad)">${ic('x')}No lo sabía</button><button class="btn pri" id="si" style="--c:var(--ok)">${ic('check')}Lo sabía</button></div>${boxes()}`;
    $('#fc').onclick=()=>{$('#fc').classList.toggle('on');$('#rt').hidden=false};

    $('#no').onclick=()=>rate(false);$('#si').onclick=()=>rate(true)};draw()}

const TRIN=[6,6,5],TRIT=20;
function vTri(){app.innerHTML=frame('--red','tags','Simulador de triaje STARS');
  $('#pb').innerHTML=`<div class="setup"><h2>Un IMV, tres triajes</h2><p>El sistema STARS (Sistema de Triaje de Alto Rendimiento SAMUR) hace tres triajes seguidos para detectar cuanto antes a los pacientes que más cuidados necesitan. Irás pasando por los tres con víctimas distintas en cada partida. Tienes ${TRIT} segundos por víctima.</p>
   <div class="list" ${cv('--red')}><button class="li all" data-t="all"><b>${ic('play')} Simulacro completo</b><small>Los tres triajes seguidos · ${TRIN.reduce((a,b)=>a+b)} víctimas${S.best.tri!==undefined?' · récord '+S.best.tri+'/'+TRIN.reduce((a,b)=>a+b):''}</small></button>${TRI.map((t,k)=>`<button class="li" data-t="${k}"><b>${esc(t.n)}</b><small>${esc(t.where)}</small></button>`).join('')}</div>
   <p style="margin-top:14px;color:var(--fg3);font-size:13.5px">El manual describe los grupos de cada triaje, pero no da cifras de corte. Los datos de cada víctima te ayudan a decidir; las explicaciones siguen el criterio del manual.</p></div>`;
  document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{const a=b.dataset.t;playTri(a==='all'?[0,1,2]:[+a],a==='all')})}
function playTri(phases,full){let pi=0,ok=0,tot=0;const wr=[];
  app.innerHTML=frame('--red','tags','Triaje STARS',`<span class="pill" id="tt"></span><span class="pill" id="ts"></span>`);
  $('#ts').innerHTML=`${ic('check')}0`;$('#tt').innerHTML=`${ic('clock')}--`;
  const intro=()=>{stopT();if(pi>=phases.length)return end();const P=TRI[phases[pi]];
    $('#pb').innerHTML=`<div class="card fade" ${cv('--red')}><div class="qk">${ic('tags')} Fase ${pi+1} de ${phases.length}</div><div class="qq">${esc(P.n)}</div>
     <div class="tri-info"><div>${ic('map-pin')}<span><b>Dónde:</b> ${esc(P.where)}</span></div><div>${ic('user-round')}<span><b>Quién:</b> ${esc(P.who)}</span></div><div>${ic('route')}<span><b>Objetivo:</b> ${esc(P.goal)}</span></div></div>
     <div class="tri-b">${P.b.map(([a,b,c])=>`<div style="--c:var(${c})"><b>${esc(a)}</b><small>${esc(b)}</small></div>`).join('')}</div>
     <div class="fb"><button class="btn pri nx" id="go" ${cv('--red')}>${ic('play')}Empezar: ${TRIN[phases[pi]]} víctimas</button></div></div>`;
    $('#go').onclick=()=>run(P,shuf(P.v).slice(0,TRIN[phases[pi]]))};
  const run=(P,vs)=>{let i=0,dead=false,got=false;const v0=APPV;const total=vs.length*TRIT*1000;const end0=performance.now()+total;
    const tick=()=>{const left=Math.max(0,end0-performance.now());const tb=$('#tb');if(tb)tb.style.width=(left/total*100)+'%';$('#tt').innerHTML=`${ic('clock')}${Math.ceil(left/1000)} s`;
      if(left<=0&&!dead){dead=true;stopT();for(let k=i+(got?1:0);k<vs.length;k++){tot++;wr.push([P,vs[k],-1])}popup('¡Tiempo!');setTimeout(()=>{if(v0!==APPV)return;pi++;intro()},900)}};
    const draw=()=>{if(dead||v0!==APPV)return;if(i>=vs.length){dead=true;stopT();pi++;return intro()}got=false;const [d,f,a,e]=vs[i];
      $('#pb').innerHTML=`<div class="timer"><i id="tb" style="width:100%"></i></div><div class="card" ${cv('--red')}><div class="qk">${esc(P.n)} · víctima ${i+1} de ${vs.length}</div><div class="victim"><span class="vn">${i+1}</span><p>${esc(d)}</p></div>
       <div class="vit">${f.map(([k,v,al])=>`<div class="${al?'al':''}"><small>${esc(k)}</small><b>${esc(v)}</b></div>`).join('')}</div>
       <div class="tri-b pick">${P.b.map(([x,y,c],j)=>`<button data-j="${j}" style="--c:var(${c})"><b>${esc(x)}</b><small>${esc(y)}</small></button>`).join('')}</div><div class="fb" id="fb"></div></div>`;tick();
      document.querySelectorAll('[data-j]').forEach(b=>b.onclick=()=>{if(dead)return;got=true;const j=+b.dataset.j;tot++;document.querySelectorAll('[data-j]').forEach(y=>{y.disabled=true;if(+y.dataset.j===a)y.classList.add('ok')});
        const right=j===a||(P.b[j][0]===P.b[a][0]&&phases[pi]===0&&j>0&&a>0);
        if(right){ok++;$('#ts').innerHTML=`${ic('check')}${ok}`;$('#fb').innerHTML=`<span class="msg ok">${ic('circle-check')}Bien</span><span style="color:var(--fg2);font-size:14px">${esc(e)}</span>`;setTimeout(()=>{i++;draw()},1300)}
        else{b.classList.add('ko');wr.push([P,vs[i],j]);$('#fb').innerHTML=`<span class="msg ko">${ic('circle-x')}Era «${esc(P.b[a][1])}»</span><div class="exp">${ic('lightbulb')}<span>${esc(e)}</span></div><button class="btn sm pri nx" id="nx">Siguiente${ic('arrow-right')}</button>`;$('#nx').onclick=()=>{i++;draw()};$('#nx').focus()}})};
    TT=setInterval(tick,200);draw()};
  const end=()=>{stopT();addXP(ok*2);if(full){S.best.tri=Math.max(S.best.tri||0,ok)}save();
    $('#tt').innerHTML=`${ic('clock')}fin`;
    $('#pb').innerHTML=`<div class="card res fade" ${cv('--red')}><div class="qk">${ic('trophy')} Fin del simulacro</div><div class="big">${ok}/${tot}</div><p>víctimas bien clasificadas · <b>+${ok*2} XP</b></p><div class="row"><button class="btn pri" id="again">${ic('rotate-ccw')}Otro simulacro</button><button class="btn" id="menu">${ic('tags')}Elegir triaje</button></div>${wr.length?`<div class="rv"><h3>Revisa estas víctimas</h3>${wr.map(([P,v,j])=>`<div><small style="color:var(--fg3)">${esc(P.n)}</small><br>${esc(v[0])}<br>→ <b>${esc(P.b[v[2]][1])}</b>${j<0?' <span style="color:var(--bad)">(sin triar a tiempo)</span>':''}<em>${esc(v[3])}</em></div>`).join('')}</div>`:''}</div>`;
    $('#again').onclick=()=>playTri(phases,full);$('#menu').onclick=vTri};
  intro()}

 {id:'conv',t:'Convulsión en el metro',src:'Convulsiones (SVB)',icon:'zap',c:'--violet',

function vCases(){app.innerHTML=frame('--green','stethoscope','Casos clínicos');
  $('#pb').innerHTML=`<div class="setup"><h2>Como en la calle</h2><p>Lee la situación y decide qué harías en cada paso. Si te desvías del procedimiento, el caso cambia y al final verás en qué te saliste y qué dice el manual.</p><div class="list" ${cv('--green')}>${CASES.map(c=>`<button class="li" data-c="${c.id}" ${cv(c.c)}><b>${ic(c.icon)} ${esc(c.t)}</b><small>${c.steps.length} decisiones · ${esc(c.src)}${S.best['case.'+c.id]!==undefined?' · récord '+S.best['case.'+c.id]+'/'+c.steps.length:''}</small></button>`).join('')}</div></div>`;
  document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>playCase(CASES.find(c=>c.id===b.dataset.c)))}
function playCase(C){let i=0,ok=0,cons='';const dev=[];
  app.innerHTML=frame(C.c,'stethoscope',C.t,`<span class="pill" id="kp"></span>`);
  const draw=()=>{if(i>=C.steps.length)return end();const st=C.steps[i];const opts=shuf(st.o.map((o,j)=>({o,j})));
    $('#kp').innerHTML=`${ic('list-ordered')}${i+1} / ${C.steps.length}`;
    $('#pb').innerHTML=`<div class="card fade" ${cv(C.c)}><div class="qk">${esc(C.src)}</div>${i===0?`<p class="case-intro">${esc(C.intro)}</p>`:''}${cons?`<div class="cons">${ic('triangle-alert')}<span>${esc(cons)}</span></div>`:''}
      ${st.v?`<div class="vit">${st.v.map(([k,v])=>`<div><small>${esc(k)}</small><b>${esc(v)}</b></div>`).join('')}</div>`:''}
      <div class="qq">${esc(st.q)}</div><div class="opts">${opts.map(({o},k)=>`<button class="opt" data-k="${k}"><span class="k">${'ABC'[k]}</span><span>${esc(o[0])}</span></button>`).join('')}</div><div class="fb" id="fb"></div></div>`;
    document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const k=+b.dataset.k;const ch=opts[k].o;const good=opts.findIndex(x=>x.o[1]);
      document.querySelectorAll('.opt').forEach((x,j)=>{x.disabled=true;if(j===good)x.classList.add('ok')});
      if(ch[1]){ok++;cons=''}else{b.classList.add('ko');cons=ch[3]||'';dev.push({q:st.q,you:ch[0],why:ch[2],right:opts[good].o})}
      $('#fb').innerHTML=`<span class="msg ${ch[1]?'ok':'ko'}">${ic(ch[1]?'circle-check':'circle-x')}${ch[1]?'Correcto':'Te has desviado del procedimiento'}</span><div class="exp">${ic('lightbulb')}<span>${esc(ch[1]?ch[2]:ch[2]+' Lo indicado: '+opts[good].o[0]+'.')}</span></div><button class="btn sm pri nx" id="nx">${i+1>=C.steps.length?'Ver resumen':'Continuar'}${ic('arrow-right')}</button>`;
      $('#nx').onclick=()=>{i++;draw()};$('#nx').focus()})};
  const end=()=>{const n=C.steps.length;addXP(ok*2);const k='case.'+C.id;S.best[k]=Math.max(S.best[k]||0,ok);save();
    $('#pb').innerHTML=`<div class="card res fade" ${cv(C.c)}><div class="qk">${ic('trophy')} Caso terminado</div><div class="big">${ok}/${n}</div><p>${ok===n?'Has seguido el procedimiento de principio a fin.':'decisiones según el procedimiento'} · <b>+${ok*2} XP</b></p><div class="row"><button class="btn pri" id="again">${ic('rotate-ccw')}Repetir caso</button><button class="btn" id="menu">${ic('stethoscope')}Otro caso</button></div>${dev.length?`<div class="rv"><h3>Dónde te desviaste</h3>${dev.map(d=>`<div><b style="color:var(--fg)">${esc(d.q)}</b><br><span style="color:var(--bad)">Elegiste:</span> ${esc(d.you)}<br><span style="color:var(--ok)">Procedimiento:</span> ${esc(d.right[0])}<em>${esc(d.right[2])}</em></div>`).join('')}</div>`:''}</div>`;
    $('#again').onclick=()=>playCase(C);$('#menu').onclick=vCases};
  draw()}

/* ---------- router y tema ---------- */
let APPV=0;
function route(){APPV++;stopT();const h=location.hash.slice(1)||'inicio';
  ({inicio:vHome,reto:vDaily,tests:vTests,examen:vExam,supervivencia:vSurv,fallos:vFails,'verdadero-falso':vVF,parejas:vPairs,unir:vMatch,escribe:vType,ordena:vOrder,clasifica:vClass,tarjetas:vFlash,casos:vCases,triaje:vTri,codigo:vCode}[h]||vHome)();
  drawTop();scrollTo(0,0)}
addEventListener('hashchange',route);
addEventListener('keydown',e=>{if(!/^[1-4a-d]$/i.test(e.key)||document.activeElement.tagName==='INPUT')return;const k='1234'.includes(e.key)?'1234'.indexOf(e.key):'abcd'.indexOf(e.key.toLowerCase());const b=document.querySelectorAll('.opt')[k];b&&!b.disabled&&b.click()});
$('#mk').innerHTML=ic('dumbbell');$('#mk0').innerHTML=ic('ambulance');
const th=()=>{const cur=document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');$('#theme').innerHTML=ic(cur==='dark'?'sun':'moon')};
$('#theme').onclick=()=>{const cur=document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.dataset.theme=cur==='dark'?'light':'dark';try{localStorage.setItem('samurpc-juegos-theme',document.documentElement.dataset.theme)}catch(e){}th()};
try{const t=localStorage.getItem('samurpc-juegos-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}
th();route();
</script>
